<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factorio Broadcast</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A0A0A">

<!-- Bricolage Grotesque carries the display hierarchy; everything else is the
     system stack, so the page renders correctly before the font arrives. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&display=swap">

<style>
/* ===========================================================================
   Nexus Core tokens (DESIGN.md).

   Dark only. The token table lists both "#0A0A0A as the neutral foundation for
   backgrounds" and "Background: #00E5FF"; the second reading would put a
   saturated cyan behind nine thousand digits of production data, so the page
   takes the first and spends cyan on accent, text-secondary and glow instead.
   =========================================================================== */
:root {
  color-scheme: dark;

  --primary:        #00E5FF;
  --tertiary:       #0A3BFF;
  --neutral:        #0A0A0A;
  --page:           #0A0A0A;
  --text-primary:   #FFFFFF;
  --text-secondary: #00E5FF;
  --text-muted:     rgba(255, 255, 255, 0.55);
  --border:         rgba(255, 255, 255, 0.2);
  --border-strong:  #FFFFFF;

  /* Glass: a white wash falling to nothing, the documented
     bg-gradient-to-b from-white/20 to-transparent, thinned for large areas. */
  --glass:          linear-gradient(to bottom, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
  --glass-strong:   linear-gradient(to bottom, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.02));
  --track:          rgba(255, 255, 255, 0.08);
  --blur:           4px;

  --shadow-card:    rgba(0, 0, 0, 0.25) 0 25px 50px -12px;
  --glow:           rgb(0, 229, 255) 0 0 8px 0;

  /* 4px base rhythm; every gap below steps through this scale. */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-14: 56px;

  --r-sm: 2px; --r-md: 4px; --r-lg: 20px; --r-pill: 9999px;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;

  --dur: 150ms;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);

  /* Five overlapping lines need five separable colours, and the palette offers
     two hues. Rather than invent a third, the ramp is shades and tints of the
     cyan and the blue plus white, separated by lightness — which survives the
     overlap better than neighbouring hues do, and reads for the colour-blind.
     The legend names every series regardless: identity is never colour alone. */
  --series-1: #00E5FF;
  --series-2: #FFFFFF;
  --series-3: #0A3BFF;
  --series-4: #00808F;
  --series-5: #8C9BFF;
  --series-6: #7FF7FF;
  --series-7: #4459B8;
  --series-8: #B9B9B9;

  /* Power satisfaction is a semantic state, the one case the palette rules
     admit. Kept desaturated so it never competes with the cyan accent. */
  --good:     #3DDC97;
  --warning:  #FFB020;
  --critical: #FF5C5C;
}

* { box-sizing: border-box; }

/* An author `display` rule outranks the UA's [hidden] { display: none }, so any
   element given a display here — the panels, the filter row, the picker — would
   ignore the attribute and show anyway. Settle it once, for everything. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 400 14px/22.75px system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* The grid is the frame: a bounded column, everything inside it on the same
   4px cadence. */
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--s-8) var(--s-8) var(--s-14);
}

@media (max-width: 720px) {
  .wrap { padding: var(--s-4) var(--s-4) var(--s-8); }
}

/* ---- shared surfaces ---------------------------------------------------- */

.card {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: var(--s-8);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-card);
}

@media (max-width: 720px) {
  .card { padding: var(--s-5); }
}

h2 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin: 0 0 var(--s-1);
}

.hint {
  font-size: 12px;
  line-height: 16px;
  color: var(--text-muted);
  margin-bottom: var(--s-5);
}

.meta {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 16px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.empty { font-size: 12px; color: var(--text-muted); padding: var(--s-2) 0; }

/* ---- hero --------------------------------------------------------------- */

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: var(--s-8);
  align-items: stretch;
  margin-bottom: var(--s-8);
}

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-visual { display: none; }
}

.hero-text {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s-4);
}

h1 {
  font-family: var(--display);
  font-size: 52px;
  font-weight: 300;
  line-height: 52px;
  letter-spacing: -0.05em;
  text-transform: uppercase;
  margin: 0;
}

@media (max-width: 720px) {
  h1 { font-size: 36px; line-height: 36px; }
}

/* A server name is whatever its owner typed — it can be long, and it can be one
   unbroken token. Let it wrap rather than run out of the column. */
h1 { overflow-wrap: anywhere; }

.subtitle {
  margin: 0;
  max-width: 60ch;
  color: var(--text-secondary);
}

.mods { display: flex; flex-wrap: wrap; gap: var(--s-1); }

.mod {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 16px;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: 0 var(--s-2);
  white-space: nowrap;
}
/* The game's own version is the one entry that is always present, so it reads
   as fact rather than as another installed mod. */
.mod.base { color: var(--text-secondary); border-color: var(--text-secondary); }

.hero-meta {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-wrap: wrap;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-left: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: var(--s-1) var(--s-3);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--text-muted);
}
.dot.live     { background: var(--primary); box-shadow: var(--glow); }
.dot.stale    { background: var(--warning); }
.dot.down     { background: var(--critical); }
/* Paused is not a fault: an idle server is the expected state between sessions,
   so it reads as quiet rather than as a warning. */
.dot.paused   { background: var(--text-muted); }

/* Sidecar picker. Hidden unless servers.json lists more than one target. */
.target {
  appearance: none;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-1) var(--s-2);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.target:hover { color: var(--text-primary); border-color: var(--border-strong); }
.target option { background: var(--neutral); color: var(--text-primary); }
/* A UA display rule on <select> outranks the plain hidden attribute. */
.target[hidden] { display: none; }

/* The dot-matrix accent. The CSS grid underneath is the fallback: it is what
   shows when WebGL is unavailable, the library fails to load, or the reader
   asked for reduced motion. */
.hero-visual {
  position: relative;
  min-height: 168px;
  border: 1px solid var(--border);
  background:
    radial-gradient(circle at center, rgba(0, 229, 255, 0.6) 0.5px, transparent 0.5px) 0 0 / 12px 12px,
    var(--glass);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.hero-visual canvas { position: absolute; top: 0; left: 0; display: block; }
.hero-visual::after {
  /* Soft depth fade, kept in CSS so it applies to both renderings. */
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(10, 10, 10, 0) 40%, rgba(10, 10, 10, 0.85));
  pointer-events: none;
}

/* ---- KPI grid ----------------------------------------------------------- */

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--s-2);
  margin-bottom: var(--s-8);
}

.tile {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: var(--s-6);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  transition: border-color var(--dur) var(--ease);
}
.tile:hover { border-color: var(--border-strong); }
.tile.wide { grid-column: 1 / -1; }

.tile .label {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: var(--s-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile .value {
  font-family: var(--display);
  font-size: 36px;
  font-weight: 300;
  line-height: 40px;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  /* "137.8 MW" has to stay on one line; wrapped, the unit reads as a second
     number stacked under the first. */
  white-space: nowrap;
}
.tile .sub { font-size: 12px; line-height: 16px; color: var(--text-muted); margin-top: var(--s-2); }
.tile code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--track);
  border-radius: var(--r-sm);
  padding: 1px 5px;
  word-break: break-all;
  color: var(--text-secondary);
}

/* ---- surface tabs ------------------------------------------------------- */

.tabs {
  display: flex;
  gap: var(--s-1);
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--s-5);
}

.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: var(--s-3) var(--s-4);
  cursor: pointer;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.tab .count { color: var(--text-muted); font-weight: 400; margin-left: var(--s-1); }

/* ---- window filter ------------------------------------------------------ */

.filters {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-wrap: wrap;
  margin-bottom: var(--s-5);
}

.filters .label {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.seg { display: inline-flex; gap: var(--s-1); flex-wrap: wrap; }

.seg button {
  appearance: none;
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-2);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  cursor: pointer;
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease),
              border-color var(--dur) var(--ease);
}
.seg button:hover { border-color: var(--border-strong); }
.seg button[aria-pressed="true"] {
  background: var(--primary);
  border-color: var(--primary);
  color: #000000;
}

/* ---- chart -------------------------------------------------------------- */

.chart-wrap { position: relative; }

.chart { width: 100%; height: auto; display: block; }
.chart.is-empty { display: none; }

.chart .grid       { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; }
.chart .axis       { stroke: var(--border); stroke-width: 1; }
.chart .line       { fill: none; stroke-width: 2; }
.chart .crosshair  { stroke: var(--primary); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .tick-label {
  fill: var(--text-muted);
  font-family: var(--mono);
  font-size: 10px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-3);
  margin-top: var(--s-3);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
}
.legend-item { display: inline-flex; align-items: center; gap: var(--s-2); }
.swatch { width: 8px; height: 8px; border-radius: var(--r-sm); flex: none; }

.tip {
  position: absolute;
  pointer-events: none;
  background: rgba(10, 10, 10, 0.9);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-2) var(--s-3);
  font-family: var(--mono);
  font-size: 11px;
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-card);
  white-space: nowrap;
  z-index: 2;
}
.tip .when { color: var(--text-secondary); margin-bottom: var(--s-1); }
.tip .row { display: flex; align-items: center; gap: var(--s-2); }
.tip .row .v { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ---- bars --------------------------------------------------------------- */

.bars { display: flex; flex-direction: column; gap: var(--s-2); }

.bar-row {
  display: grid;
  grid-template-columns: 20px minmax(0, 128px) 1fr auto;
  align-items: center;
  gap: var(--s-3);
  font-size: 12px;
  line-height: 16px;
}
.bar-name {
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track { background: var(--track); height: 6px; border-radius: var(--r-sm); overflow: hidden; }
.bar-fill {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: var(--r-sm);
  transition: width var(--dur) var(--ease);
}
.bar-fill.alt { background: var(--tertiary); }
.bar-value {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.bar-group {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: var(--s-4) 0 var(--s-2);
}

/* ---- electric networks -------------------------------------------------- */

.net + .net { margin-top: var(--s-6); border-top: 1px solid var(--border); padding-top: var(--s-6); }

.net-head {
  display: flex;
  align-items: baseline;
  gap: var(--s-3);
  flex-wrap: wrap;
  margin-bottom: var(--s-2);
}
.net-title {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.net-nums { font-family: var(--mono); font-size: 12px; color: var(--text-muted); margin-left: auto; }

.sat {
  font-family: var(--mono);
  font-size: 11px;
  border-radius: var(--r-pill);
  border: 1px solid currentColor;
  padding: 0 var(--s-2);
}
.sat.good     { color: var(--good); }
.sat.warning  { color: var(--warning); }
.sat.critical { color: var(--critical); }

/* ---- tables ------------------------------------------------------------- */

table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: var(--s-1) var(--s-2) var(--s-1) 0; border-bottom: 1px solid var(--track); }
th {
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

details { margin-top: var(--s-5); }
summary {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  cursor: pointer;
}
.scroll { overflow-x: auto; }

/* ---- layout ------------------------------------------------------------- */

.stack { display: grid; gap: var(--s-2); }

.grid2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: var(--s-2);
}

/* Production and Consumption sit side by side, as they do in game. Below 900px
   they stack rather than squeeze a 600-wide plot into half a phone. */
.panels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: var(--s-2);
  align-items: start;
}

.panel-head {
  display: flex;
  align-items: baseline;
  gap: var(--s-3);
}

/* The game's reset-filters button is red and appears in the panel header. It is
   hidden until a filter is actually set, so it never suggests state that is not
   there. */
.reset {
  appearance: none;
  margin-left: auto;
  background: transparent;
  color: var(--critical);
  border: 1px solid var(--critical);
  border-radius: var(--r-md);
  padding: 0 var(--s-2);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.reset:hover { background: var(--critical); color: #000000; }

/* A "slot" is one row of the item list: click to filter the graph to it, click
   again to drop it. Multi-select is additive, no modifier, as in game. */
.slots .bar-row {
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  padding: 1px var(--s-1);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.slots .bar-row:hover { background: var(--track); }
.slots .bar-row.on { border-color: var(--primary); background: rgba(0, 229, 255, 0.08); }

/* An item with no series behind it cannot be plotted, so it does not pretend to
   be clickable. The mod sends the top ten each way; the rest are numbers only. */
.slots .bar-row.no-series { cursor: default; }
.slots .bar-row.no-series:hover { background: none; }
.slots .bar-row.no-series .bar-name { opacity: 0.75; }

/* The swatch doubles as the legend: it is the line's colour on the graph above,
   and blank for rows that have no line. */
.slot-key {
  width: 8px;
  height: 8px;
  border-radius: var(--r-sm);
  flex: none;
  border: 1px solid var(--border);
}

.bar-row.slot {
  grid-template-columns: 10px 20px minmax(0, 118px) 1fr auto;
}

/* Factorio ships each icon as a MIPMAP STRIP, not a single image: iron-plate.png
   is 120x64, being the 64px icon followed by its 32, 16 and 8px reductions laid
   out to the right. Drawn whole it looks like the icon with three shrinking
   copies trailing off it.

   So it is a background rather than an <img>: sizing to "auto 100%" makes the
   strip's height fill the box and anchoring it left shows exactly the first,
   largest square. A plain square icon with no mipmaps fills the box the same
   way, so this needs no per-file knowledge. */
.icon {
  width: 20px;
  height: 20px;
  flex: none;
  background-repeat: no-repeat;
  background-position: left center;
  background-size: auto 100%;
  image-rendering: pixelated;
}

/* Hover-to-highlight, added to the game in 2.0.7: the hovered line stays, the
   others recede. Done with opacity so no line actually disappears. */
.chart .line.dim { opacity: 0.15; }
.chart .line.hot { stroke-width: 3; }

.panel .chart-wrap { margin-bottom: var(--s-4); }

.net-card + .net-card { margin-top: var(--s-4); }

/* The search control the game puts in its window chrome: a magnifier that
   opens a field. One per list, since each panel here owns its own. */
.search-toggle {
  appearance: none;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 2px 6px;
  margin-left: auto;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.search-toggle:hover { color: var(--text-primary); border-color: var(--border-strong); }

.search-input {
  appearance: none;
  background: var(--track);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text-primary);
  font-family: var(--mono);
  font-size: 12px;
  padding: 2px var(--s-2);
  width: 140px;
}
.search-input:focus { outline: none; border-color: var(--primary); }

/* A network graph is a sparkline, not a plot: no axes, no labels, just shape. */
.power-chart { height: 46px; margin-bottom: var(--s-2); }

/* The L screen's item table: a grid of icons with a count badge, not a list. */
.contents {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
  gap: var(--s-1);
}
.cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--s-1);
  background: var(--track);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  transition: border-color var(--dur) var(--ease);
}
.cell:hover { border-color: var(--border); }
.cell-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

/* Satisfaction, and the game's own producer/consumer split, as a bar. */
.meter {
  height: 8px;
  background: var(--track);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin: var(--s-2) 0;
}
.meter span { display: block; height: 100%; background: var(--primary); }
.meter span.warning { background: var(--warning); }
.meter span.critical { background: var(--critical); }

.stat-row {
  display: flex;
  gap: var(--s-4);
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
}
.stat-row b {
  color: var(--text-primary);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.tabs.sub { border-bottom: 0; margin-bottom: var(--s-3); }
.tabs.sub .tab { padding: var(--s-2) var(--s-3); }

footer {
  margin-top: var(--s-8);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-text">
      <h1 id="title">Factorio Broadcast</h1>
      <p class="subtitle" id="subtitle" hidden></p>
      <div class="mods" id="mods"></div>
      <div class="hero-meta">
        <span class="meta" id="clock">—</span>
        <select class="target" id="server" aria-label="Server" hidden></select>
        <span class="meta" id="target-note"></span>
        <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
      </div>
    </div>
    <div class="hero-visual" id="webgl-container" aria-hidden="true"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <!-- The game keeps these on three separate screens: P for production, a click
       on a pole for the electric network, L for logistic networks. Here they are
       tabs over one surface. -->
  <div class="tabs" id="sections" role="tablist">
    <button class="tab" role="tab" data-section="production" aria-selected="true">Production</button>
    <button class="tab" role="tab" data-section="electricity" aria-selected="false">Electricity</button>
    <button class="tab" role="tab" data-section="logistics" aria-selected="false">Logistics</button>
  </div>

  <div class="tabs sub" id="tabs" role="tablist"></div>

  <!-- Timespan, then the Items/Fluids split. 2.0 puts the timespan row above
       the tab row; 1.1 had them the other way round. -->
  <div class="filters">
    <span class="label">Timespan</span>
    <span class="seg" id="windows"></span>
    <span class="seg" id="kinds" hidden>
      <button data-kind="items" aria-pressed="true">Items</button>
      <button data-kind="fluids" aria-pressed="false">Fluids</button>
    </span>
    <span class="meta" id="window-note"></span>
  </div>

  <!-- Production: two panels, made on the left and used on the right, each with
       its own graph over its own list — the shape of the in-game screen. -->
  <div class="panels" id="panel-production">
    <section class="card panel">
      <div class="panel-head">
        <h2>Production</h2>
        <button class="search-toggle" data-search="produced" aria-label="Search" title="Search">⌕</button>
        <input class="search-input" data-search-input="produced" type="search" placeholder="Filter…" hidden>
        <button class="reset" data-reset="produced" hidden>Reset filters</button>
      </div>
      <div class="hint window-hint">per minute</div>
      <div class="chart-wrap">
        <svg class="chart" id="chart-produced" viewBox="0 0 600 180" role="img" aria-label="Production over time"></svg>
        <div class="tip" id="tip-produced" hidden></div>
      </div>
      <div class="bars slots" id="produced"></div>
    </section>

    <section class="card panel">
      <div class="panel-head">
        <h2>Consumption</h2>
        <button class="search-toggle" data-search="consumed" aria-label="Search" title="Search">⌕</button>
        <input class="search-input" data-search-input="consumed" type="search" placeholder="Filter…" hidden>
        <button class="reset" data-reset="consumed" hidden>Reset filters</button>
      </div>
      <div class="hint window-hint">per minute</div>
      <div class="chart-wrap">
        <svg class="chart" id="chart-consumed" viewBox="0 0 600 180" role="img" aria-label="Consumption over time"></svg>
        <div class="tip" id="tip-consumed" hidden></div>
      </div>
      <div class="bars slots" id="consumed"></div>
    </section>
  </div>

  <div id="panel-electricity" hidden>
    <section class="card">
      <div class="panel-head">
        <h2>Electric networks</h2>
        <button class="search-toggle" data-search="power" aria-label="Search" title="Search">⌕</button>
        <input class="search-input" data-search-input="power" type="search" placeholder="Filter…" hidden>
      </div>
      <div class="hint" id="power-hint">per electric network</div>
      <div id="power"></div>
    </section>
  </div>

  <div id="panel-logistics" hidden>
    <section class="card">
      <div class="panel-head">
        <h2>Logistic networks</h2>
        <button class="search-toggle" data-search="logistics" aria-label="Search" title="Search">⌕</button>
        <input class="search-input" data-search-input="logistics" type="search" placeholder="Filter…" hidden>
        <select class="target" id="network" aria-label="Logistic network" hidden></select>
      </div>
      <div class="hint" id="logistics-hint">per network on this surface</div>
      <div id="logistics"></div>
    </section>
  </div>

  <footer id="foot">—</footer>
</div>

<script>
'use strict';

// The list shows everything with a non-zero rate, as the game does. Only the
// graph is bounded, and only because each line costs the game 300 API reads.
const TOP_N = Infinity;
// Every item gets a line, as in game. The palette has eight entries and wraps,
// so colour alone stops identifying a line once there are more than eight —
// which is what the slot list, the hover highlight and click-to-isolate are for.
const PALETTE = 8;

// How much wall-clock each statistics window covers. Each window holds 300
// samples spread across this span.
const WINDOW_SPAN = {
  '5s': '5 s', '1m': '1 min', '10m': '10 min', '1h': '1 h',
  '10h': '10 h', '50h': '50 h', '250h': '250 h', '1000h': '1000 h',
  all: 'all time',
};

// "all" is a cumulative count, not a per-minute rate, so it formats and labels
// differently everywhere it appears.
const TOTALS_WINDOW = 'all';

let snapshot = null;
let surface = null;
let selectedWindow = null;
// Which of the three screens is showing, and - on the production screen - items
// or fluids. Both are view state; neither survives a change of server.
let section = 'production';
let kind = 'items';
// One selection, shared by both panels: picking iron plate is a question about
// iron plate, and the answer is only half there if consumption keeps every other
// line. The game filters per panel; this is a deliberate divergence.
const selected = new Set();
// The slot being hovered, which highlights its line without hiding the others.
let hovered = null;
let hoverPanel = null;
// Graph series, kept here rather than read out of each snapshot: they arrive on
// their own event and outlive any one frame.
let history = {};
// One filter box per list, by panel key. The game puts a magnifier in the
// window chrome that opens a field; these sit in each panel header instead,
// because each panel here has its own list.
const search = { produced: '', consumed: '', power: '', logistics: '' };

// Which logistic network the L-screen equivalent is showing, by network_id.
let logisticNetwork = null;

// Liveness is measured on the tick, not on frame arrival — see updateStatus.
let lastTick = null;
let lastProgressAt = 0;
let streamOpen = false;
let hoverIndex = null;

// ---- formatting -----------------------------------------------------------

function watts(w) {
  const abs = Math.abs(w);
  if (abs >= 1e9) return (w / 1e9).toFixed(1) + ' GW';
  if (abs >= 1e6) return (w / 1e6).toFixed(1) + ' MW';
  if (abs >= 1e3) return (w / 1e3).toFixed(1) + ' kW';
  return Math.round(w) + ' W';
}

function rate(n) {
  if (n >= 1000) return Math.round(n).toLocaleString();
  if (n >= 100) return n.toFixed(0);
  if (n >= 10) return n.toFixed(1);
  return n.toFixed(2);
}

function count(n) {
  return Math.round(n).toLocaleString();
}

/** Axis ticks are compact, not precise: 0, 12k, 1.2M. */
function axisLabel(v) {
  if (v === 0) return '0';
  if (v >= 1e6) return (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k';
  return String(Math.round(v));
}

function pretty(name) {
  return name.replace(/-/g, ' ').replace(/^./, (c) => c.toUpperCase());
}

/**
 * The item's own icon, served by the sidecar out of a Factorio install — the
 * dashboard ships none of Wube's artwork itself.
 *
 * A sidecar started without FB_ICONS_DIR answers 404 for all of them, and a full
 * install still has a handful of prototypes whose icon file is named something
 * else. Either way the <img> collapses and the row falls back to its name, which
 * is why the name is always rendered too.
 */
function icon(name) {
  return `<span class="icon" role="img" aria-label="${pretty(name)}"
    style="background-image:url('${target.url}/icons/${encodeURIComponent(name)}.png')"></span>`;
}

// ---- rendering ------------------------------------------------------------

function tile(label, value, sub) {
  return `<div class="tile">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

/**
 * One row of a panel's item list — the game calls these slots, and clicking one
 * filters the graph above to it. A row is only clickable when the mod actually
 * sent a series for that item: it ships the top ten each way, and a row with no
 * line behind it would be a button that does nothing.
 *
 * The colour key on the left is the row's line on the graph, so the list doubles
 * as the legend rather than needing a separate one.
 */
function renderSlots(el, entries, format, panel, slotOf, selected) {
  if (!entries.length) {
    el.innerHTML = '<div class="empty">Nothing recorded in this window.</div>';
    return;
  }
  const max = entries[0][1];
  el.innerHTML = entries.map(([name, value]) => {
    const pct = max > 0 ? Math.max(1.5, (value / max) * 100) : 0;
    const slot = slotOf.get(name);
    const plottable = slot !== undefined;
    const on = selected.has(name);
    const key = plottable
      ? `<span class="slot-key" style="background:var(--series-${(slot % PALETTE) + 1});border-color:var(--series-${(slot % PALETTE) + 1})"></span>`
      : '<span class="slot-key"></span>';
    const title = plottable
      ? `${pretty(name)}: ${format(value)} — click to filter the graph`
      : `${pretty(name)}: ${format(value)} — no graph series for this item`;
    return `<div class="bar-row slot${on ? ' on' : ''}${plottable ? '' : ' no-series'}"
      data-item="${name}" data-panel="${panel}" title="${title}">
      ${key}
      ${icon(name)}
      <span class="bar-name">${pretty(name)}</span>
      <span class="bar-track"><span class="bar-fill${panel === 'consumed' ? ' alt' : ''}" style="width:${pct}%"></span></span>
      <span class="bar-value">${format(value)}</span>
    </div>`;
  }).join('');
}

/**
 * Science is the headline number, and it is not one number.
 *
 *   spm    research units per minute - what "1k SPM" means in the community.
 *          A unit needs the whole ingredient list, so the rate is set by the
 *          scarcest pack: min over ingredients of consumed/amount.
 *   packs  every science pack consumed per minute, added up. Always the larger
 *          figure, and the one that moves when you add a pack type.
 *
 * Both are summed across surfaces first: labs can sit on any planet.
 */
function scienceRates(snapshot, window) {
  const consumed = {};
  for (const surface of Object.values(snapshot.surfaces)) {
    const flow = surface.items[window];
    if (!flow) continue;
    for (const [name, value] of Object.entries(flow.consumed)) {
      if (!name.endsWith('science-pack')) continue;
      consumed[name] = (consumed[name] ?? 0) + value;
    }
  }

  const packs = Object.values(consumed).reduce((a, b) => a + b, 0);
  const ingredients = (snapshot.meta.research && snapshot.meta.research.ingredients) || [];

  let spm = null;
  if (ingredients.length) {
    spm = Math.min(...ingredients.map((i) => (consumed[i.name] ?? 0) / (i.amount || 1)));
  } else if (Object.keys(consumed).length) {
    // No research running: fall back to the scarcest pack still being drunk.
    spm = Math.min(...Object.values(consumed));
  }

  return { spm, packs, types: Object.keys(consumed).length };
}

/**
 * Substring match on the prototype name and on the prettified label, so both
 * "iron-plate" and "Iron plate" find it. Case-insensitive, and applied on every
 * keystroke rather than on submit.
 */
function matches(name, term) {
  if (!term) return true;
  const needle = term.toLowerCase();
  return name.toLowerCase().includes(needle) || pretty(name).toLowerCase().includes(needle);
}

function filterEntries(entries, term) {
  return term ? entries.filter(([name]) => matches(name, term)) : entries;
}

function topEntries(map, n) {
  return Object.entries(map || {})
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n);
}

function satClass(pct) {
  if (pct >= 99) return 'good';
  if (pct >= 90) return 'warning';
  return 'critical';
}

function renderPower(el, networks, series) {
  // A network the game will not measure still gets a card, so the surface does
  // not read as having no power at all.
  const live = networks.filter((n) => n.noStats || n.producedW > 0 || n.consumedW > 0);
  if (!live.length) {
    el.innerHTML = '<div class="empty">No powered network on this surface.</div>';
    return;
  }
  live.sort((a, b) => b.producedW - a.producedW);

  el.innerHTML = live.map((net) => {
    const cls = satClass(net.satisfaction);
    // Icon + label, never colour alone.
    const mark = cls === 'good' ? '✓' : cls === 'warning' ? '!' : '✕';
    // The filter reaches the per-entity breakdown, which is the only list here.
    const producers = filterEntries(topEntries(net.producersW, Infinity), search.power);
    const consumers = filterEntries(topEntries(net.consumersW, Infinity), search.power);
    const scale = Math.max(
      producers.length ? producers[0][1] : 0,
      consumers.length ? consumers[0][1] : 0,
    );
    const row = (entries, alt) => entries.map(([name, value]) => {
      const pct = scale > 0 ? Math.max(1.5, (value / scale) * 100) : 0;
      return `<div class="bar-row" title="${pretty(name)}: ${watts(value)}">
        ${icon(name)}
        <span class="bar-name">${pretty(name)}</span>
        <span class="bar-track"><span class="bar-fill${alt ? ' alt' : ''}" style="width:${pct}%"></span></span>
        <span class="bar-value">${watts(value)}</span>
      </div>`;
    }).join('');

    if (net.noStats) {
      return `<div class="net">
        <div class="net-head"><span class="net-title">Network ${net.id}</span></div>
        <div class="empty">This surface has no electric pole, and the game exposes
          network statistics through poles and nowhere else — not through the
          accumulator that identified the network, not through the force, not
          through the surface. One pole anywhere on it would make this measurable.</div>
      </div>`;
    }
    return `<div class="net">
      <div class="net-head">
        <span class="net-title">Network ${net.id}</span>
        <span class="sat ${cls}">${mark} ${net.satisfaction.toFixed(0)}% satisfied</span>
        <span class="net-nums">${watts(net.producedW)} produced · ${watts(net.consumedW)} drawn</span>
      </div>
      ${powerChart(net.id, series, 'produced', 'Production')}
      <div class="bar-group">Producing</div>
      <div class="bars">${row(producers, false) || '<div class="empty">—</div>'}</div>
      ${powerChart(net.id, series, 'consumed', 'Consumption')}
      <div class="bar-group">Drawing</div>
      <div class="bars">${row(consumers, true) || '<div class="empty">—</div>'}</div>
    </div>`;
  }).join('');
}

/**
 * One of the electric network window's two line graphs. Same 300-sample series
 * the item graphs use, read off pole.electric_network_statistics — which is a
 * LuaFlowStatistics like any other, so the machinery is shared.
 *
 * Drawn inline rather than through renderChart: these are small, there is one
 * per network per direction, and they carry no crosshair or selection.
 */
function powerChart(id, series, panel, label) {
  const lines = ((series || {})[String(id)] || {})[panel] || {};
  const names = Object.keys(lines);
  if (!names.length) return '';

  const W = 600, H = 90, T = 4, B = 4;
  const points = Math.max(...names.map((n) => lines[n].length));
  // Joules per tick on the wire; watts is that times the 60 ticks in a second.
  const max = Math.max(...names.flatMap((n) => lines[n]), 1) * 60;

  const x = (i) => (i / Math.max(1, points - 1)) * W;
  const y = (v) => T + (1 - (v * 60) / max) * (H - T - B);

  const paths = names.map((name, i) => {
    const d = lines[name].map((v, idx) => `${idx === 0 ? 'M' : 'L'}${x(idx).toFixed(1)},${y(v).toFixed(1)}`).join('');
    return `<path class="line" d="${d}" stroke="var(--series-${(i % PALETTE) + 1})" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  return `<div class="bar-group">${label} · peak ${watts(max)}</div>
    <svg class="chart power-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="${label} over time">${paths}</svg>`;
}

// Colour follows the item, never its rank: the mod sends whichever items are
// currently busiest, so without this a series would change colour the moment
// two items swapped places.
const colourSlots = new Map();

function assignSlots(surfaceName, names) {
  const key = (n) => `${surfaceName}|${n}`;
  const used = new Set();
  const out = names.map(() => null);

  // Keep an item's existing colour whenever that slot is still free.
  names.forEach((name, i) => {
    const slot = colourSlots.get(key(name));
    if (slot !== undefined && !used.has(slot)) {
      used.add(slot);
      out[i] = slot;
    }
  });

  names.forEach((name, i) => {
    if (out[i] !== null) return;
    let slot = 0;
    while (used.has(slot)) slot++;
    used.add(slot);
    colourSlots.set(key(name), slot);
    out[i] = slot;
  });

  return out;
}

/**
 * One panel's graph, over the game's own 300 samples for the selected window.
 *
 * `selected` empty means draw everything, which is what the game does until you
 * click a slot. A non-empty selection draws only those items and lets the y axis
 * rescale to them — the point of the feature is that one item's shape is
 * unreadable at the scale of the whole factory.
 *
 * `hovered` dims the other lines rather than removing them, which is the
 * separate hover behaviour the game gained in 2.0.7.
 */
function renderChart(panel, series, window, slotOf, selected, emptyMessage) {
  const svg = document.getElementById(`chart-${panel}`);
  const all = Object.keys(series);
  const names = selected.size ? all.filter((n) => selected.has(n)) : all;

  if (!names.length) {
    // Collapse rather than leave the plot's height as dead space.
    svg.innerHTML = '';
    svg.classList.add('is-empty');
    return emptyMessage || (all.length ? 'Nothing selected.' : 'No graph samples yet — history is sent every few seconds.');
  }
  svg.classList.remove('is-empty');

  const W = 600, H = 180, L = 46, R = 8, T = 10, B = 20;
  const points = Math.max(...names.map((n) => series[n].length));
  const max = Math.max(...names.flatMap((n) => series[n]), 1);
  // Round the top of the scale up to something readable.
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const niceMax = Math.ceil(max / step) * step;

  const x = (i) => L + (i / Math.max(1, points - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / niceMax) * (H - T - B);

  const gridlines = [0, 0.5, 1].map((f) => {
    const value = niceMax * f;
    const yy = y(value);
    return `<line class="grid" x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}"/>
      <text class="tick-label" x="${L - 6}" y="${yy + 3}" text-anchor="end">${axisLabel(value)}</text>`;
  }).join('');

  const lines = names.map((name) => {
    const values = series[name];
    const slot = slotOf.get(name) ?? 0;
    const d = values.map((v, idx) => `${idx === 0 ? 'M' : 'L'}${x(idx).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const state = hovered && hovered !== name ? ' dim' : (hovered === name ? ' hot' : '');
    return `<path class="line${state}" d="${d}" stroke="var(--series-${(slot % PALETTE) + 1})" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const cross = hoverIndex === null || hoverPanel !== panel ? '' :
    `<line class="crosshair" x1="${x(hoverIndex)}" y1="${T}" x2="${x(hoverIndex)}" y2="${H - B}"/>`;

  svg.innerHTML = `${gridlines}
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    ${lines}${cross}
    <text class="tick-label" x="${L}" y="${H - 6}">−${WINDOW_SPAN[window] || window}</text>
    <text class="tick-label" x="${W - R}" y="${H - 6}" text-anchor="end">now</text>`;

  svg.dataset.points = String(points);
  svg.dataset.names = JSON.stringify(names);
  return null;
}

function renderTip(panel, series, window, slotOf) {
  const tip = document.getElementById(`tip-${panel}`);
  const svg = document.getElementById(`chart-${panel}`);
  const names = JSON.parse(svg.dataset.names || '[]');
  if (hoverIndex === null || hoverPanel !== panel || !names.length) { tip.hidden = true; return; }

  const points = Number(svg.dataset.points || 1);
  const ago = points - 1 - hoverIndex;
  tip.hidden = false;
  tip.innerHTML =
    `<div class="when">${ago === 0 ? 'now' : `${((ago / (points - 1)) * 100).toFixed(0)}% of ${WINDOW_SPAN[window] || window} ago`}</div>` +
    names.map((n) =>
      `<div class="row"><span class="swatch" style="background:var(--series-${((slotOf.get(n) ?? 0) % PALETTE) + 1})"></span>${pretty(n)}<span class="v">${rate(series[n][hoverIndex] ?? 0)}</span></div>`
    ).join('');

  const wrap = svg.parentElement;
  const frac = hoverIndex / Math.max(1, points - 1);
  const left = 46 / 600 * wrap.clientWidth + frac * ((600 - 46 - 8) / 600) * wrap.clientWidth;
  tip.style.left = Math.min(wrap.clientWidth - tip.offsetWidth - 4, left + 10) + 'px';
  tip.style.top = '6px';
}

const MODS_SHOWN = 10;

/**
 * The hero carries the server's identity, not the tool's. Name and description
 * come from server-settings.json by way of the sidecar; the mod list comes from
 * script.active_mods inside the game. Any of the three can be missing — an
 * unnamed server, or a sidecar started without FB_SERVER_SETTINGS — and the
 * page falls back to its own title rather than showing an empty heading.
 *
 * Built as nodes: a server name and a mod list are both operator-supplied text
 * arriving over the wire, and neither should be able to write markup here.
 */
function renderIdentity(meta) {
  const server = meta.server || {};
  const name = (server.name || '').trim() || 'Factorio Broadcast';
  document.getElementById('title').textContent = name;
  document.title = name === 'Factorio Broadcast' ? name : name + ' · Factorio Broadcast';

  const subtitle = document.getElementById('subtitle');
  const description = (server.description || '').trim();
  subtitle.textContent = description;
  subtitle.hidden = !description;

  // base first: it is the game version, and reads as the thing everything else
  // is installed on top of. The rest alphabetically.
  const entries = Object.entries(meta.mods || {}).sort((a, b) => {
    if (a[0] === 'base') return -1;
    if (b[0] === 'base') return 1;
    return a[0].localeCompare(b[0]);
  });

  const chips = entries.slice(0, MODS_SHOWN).map(([mod, version]) => {
    const el = document.createElement('span');
    el.className = mod === 'base' ? 'mod base' : 'mod';
    el.textContent = `${mod} ${version}`;
    return el;
  });

  // Never silently truncate: say how many are not shown, and name them on hover.
  const hidden = entries.slice(MODS_SHOWN);
  if (hidden.length) {
    const more = document.createElement('span');
    more.className = 'mod';
    more.textContent = `+${hidden.length} more`;
    more.title = hidden.map(([mod, version]) => `${mod} ${version}`).join('\n');
    chips.push(more);
  }

  document.getElementById('mods').replaceChildren(...chips);
}

/**
 * One network's bots, cells and contents — the Items table of the in-game L
 * screen. With more than one network on the surface the game gives you a list to
 * pick from; here that is a dropdown, keyed on network_id so the choice survives
 * the next snapshot.
 */
function renderLogistics(el, networks) {
  if (!networks.length) {
    el.innerHTML = '<div class="empty">No logistic network on this surface.</div>';
    return;
  }
  // The game identifies a network by its cell count in the L screen, so the
  // largest reads as the main one.
  const sorted = networks.slice().sort((a, b) => b.cells - a.cells);

  const picker = document.getElementById('network');
  picker.hidden = sorted.length < 2;
  if (!sorted.some((n) => String(n.id) === logisticNetwork)) logisticNetwork = String(sorted[0].id);
  picker.replaceChildren(...sorted.map((net) => {
    const option = document.createElement('option');
    option.value = String(net.id);
    option.textContent = `Network ${net.id} · ${count(net.cells)} cells`;
    option.selected = String(net.id) === logisticNetwork;
    return option;
  }));

  const shown = sorted.filter((net) => String(net.id) === logisticNetwork);

  el.innerHTML = shown.map((net) => {
    // "Available" and "Total" are the game's words. It never says "idle" about
    // a robot - the only Idle string in the locale belongs to spidertron.
    const busy = (all, avail) => (all > 0 ? ((all - avail) / all) * 100 : 0);
    const bar = (all, avail) => {
      const pct = busy(all, avail);
      const cls = pct >= 95 ? 'critical' : pct >= 80 ? 'warning' : '';
      return `<div class="meter"><span class="${cls}" style="width:${pct.toFixed(1)}%"></span></div>`;
    };
    return `<div class="net-card">
      <div class="net-head">
        <span class="net-title">Network ${net.id}</span>
        <span class="net-nums">${count(net.cells)} cells</span>
      </div>
      <div class="bar-group">Logistic robots</div>
      ${bar(net.bots_all, net.bots_idle)}
      <div class="stat-row">
        <span><b>${count(net.bots_all - net.bots_idle)}</b> working</span>
        <span><b>${count(net.bots_idle)}</b> available</span>
        <span><b>${count(net.bots_all)}</b> total</span>
      </div>
      <div class="bar-group">Construction robots</div>
      ${bar(net.construction_all, net.construction_idle)}
      <div class="stat-row">
        <span><b>${count(net.construction_all - net.construction_idle)}</b> working</span>
        <span><b>${count(net.construction_idle)}</b> available</span>
        <span><b>${count(net.construction_all)}</b> total</span>
      </div>
      ${contentsGrid(net.contents)}
    </div>`;
  }).join('');
}

/**
 * What the network is holding. The game shows this as a grid of item icons with
 * counts, so this does the same rather than making a list of it. Counts are
 * summed across quality tiers: the mod merges them, because a separate row per
 * tier would double the grid for a distinction shown nowhere else here.
 */
function contentsGrid(contents) {
  const entries = Object.entries(contents || {})
    .filter(([name, n]) => n > 0 && matches(name, search.logistics))
    .sort((a, b) => b[1] - a[1]);

  if (!entries.length) {
    return '<div class="bar-group">Contents</div><div class="empty">Network is empty.</div>';
  }

  return `<div class="bar-group">Contents · ${count(entries.length)} item types</div>
    <div class="contents">` +
    entries.map(([name, n]) =>
      `<div class="cell" title="${pretty(name)}: ${count(n)}">
        ${icon(name)}
        <span class="cell-count">${abbrev(n)}</span>
      </div>`).join('') +
    '</div>';
}

/** 1.5k, 93k, 2.4M — the game's own badge style for stack counts. */
function abbrev(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k';
  return String(Math.round(n));
}

function render() {
  if (!snapshot) return;
  const names = snapshot.meta.surfaceNames || Object.keys(snapshot.surfaces);
  if (!surface || !snapshot.surfaces[surface]) surface = names[0];

  const s = snapshot.surfaces[surface];
  const m = snapshot.meta;

  renderIdentity(m);

  // Surface tabs
  document.getElementById('tabs').innerHTML = names.map((name) => {
    const surf = snapshot.surfaces[name];
    const nets = surf ? surf.power.filter((n) => n.producedW > 0).length : 0;
    return `<button class="tab" role="tab" data-surface="${name}"
      aria-selected="${name === surface}">${pretty(name)}${nets ? `<span class="count">${nets}⚡</span>` : ''}</button>`;
  }).join('');

  for (const tab of document.querySelectorAll('#sections .tab')) {
    tab.setAttribute('aria-selected', String(tab.dataset.section === section));
  }
  document.getElementById('panel-production').hidden = section !== 'production';
  document.getElementById('panel-electricity').hidden = section !== 'electricity';
  document.getElementById('panel-logistics').hidden = section !== 'logistics';
  // Items/Fluids only splits the production screen; the other two have no such
  // division, and a timespan means nothing to a live robot count.
  document.getElementById('kinds').hidden = section !== 'production';
  document.getElementById('windows').parentElement.hidden = section === 'logistics';

  // Totals across every network on this surface.
  const produced = s ? s.power.reduce((a, n) => a + n.producedW, 0) : 0;
  const consumed = s ? s.power.reduce((a, n) => a + n.consumedW, 0) : 0;
  const sat = produced > 0 ? Math.min(100, (consumed / produced) * 100) : 0;
  const research = m.research;

  // Which statistics window the rates and the graphs are read from.
  const windows = (m.windows && m.windows.length) ? m.windows : [m.baseWindow || '1m'];
  if (!selectedWindow || !windows.includes(selectedWindow)) selectedWindow = m.baseWindow || windows[0];
  document.getElementById('windows').innerHTML = windows.map((w) =>
    `<button data-window="${w}" aria-pressed="${w === selectedWindow}">${w}</button>`).join('');
  for (const button of document.querySelectorAll('#kinds button')) {
    button.setAttribute('aria-pressed', String(button.dataset.kind === kind));
  }

  const isTotals = selectedWindow === TOTALS_WINDOW;
  const span = WINDOW_SPAN[selectedWindow] || selectedWindow;
  const fmt = isTotals ? count : rate;

  document.getElementById('window-note').textContent = isTotals
    ? 'cumulative since the save began'
    : `averaged over the last ${span}`;
  for (const hint of document.querySelectorAll('.window-hint')) {
    hint.textContent = isTotals ? 'total ever made' : `per minute, averaged over ${span}`;
  }

  const flows = (s && s[kind === 'fluids' ? 'fluids' : 'items'][selectedWindow]) || { produced: {}, consumed: {} };

  // The game exposes no UPS of its own; the sidecar derives it from how far the
  // tick advances per second of wall clock.
  const ups = snapshot.ups;
  const target = 60 * (m.speed || 1);
  const upsSub = ups === null ? 'measuring…'
    : ups >= target - 2 ? `at the ${target} target`
    : `below the ${target} target`;

  // Science is measured over a real window even on the "all" tab, where the
  // figures are lifetime totals and a per-minute rate has no meaning.
  const scienceWindow = isTotals ? (m.baseWindow || '1m') : selectedWindow;
  const science = scienceRates(snapshot, scienceWindow);
  const scienceSpan = WINDOW_SPAN[scienceWindow] || scienceWindow;

  document.getElementById('tiles').innerHTML = [
    tile('SPM', science.spm === null ? '—' : rate(science.spm),
         `research units/min · ${scienceSpan}`),
    tile('Science packs/min', rate(science.packs),
         science.types ? `${science.types} pack types · ${scienceSpan}` : 'no science being consumed'),
    tile('UPS', ups === null ? '—' : ups.toFixed(1), upsSub),
    tile('Power produced', watts(produced), pretty(surface)),
    tile('Power drawn', watts(consumed), sat.toFixed(0) + '% satisfied'),
    tile('Pollution', s ? count(s.pollution) : '0', pretty(surface)),
    tile('Research', research ? Math.round(research.progress) + '%' : '—',
         research ? pretty(research.name) : 'nothing queued'),
    tile('Rockets launched', count(m.rockets || 0), 'all surfaces'),
    tile('Players online', String(m.playersOnline ?? 0),
         (m.players || []).map((p) => p.name).join(', ') || 'nobody connected'),
  ].join('');

  if (section === 'electricity') {
    const live = s ? s.power.filter((n) => n.noStats || n.producedW > 0 || n.consumedW > 0).length : 0;
    document.getElementById('power-hint').textContent =
      // Count what is actually drawn: a planet accumulates stub networks with
      // no flow at all, and reporting eight where one is shown is just wrong.
      live ? `${live} network(s) on ${pretty(surface)} · 1m window` : 'per electric network';
    const powerSeries = ((history[surface] || {})[selectedWindow] || {}).power;
    renderPower(document.getElementById('power'), s ? s.power : [], powerSeries);
  }

  if (section === 'logistics') {
    const nets = s ? s.logistics : [];
    document.getElementById('logistics-hint').textContent = nets.length
      ? `${nets.length} network(s) on ${pretty(surface)} · current state, not a window`
      : 'per network on this surface';
    renderLogistics(document.getElementById('logistics'), nets);
  }

  document.getElementById('clock').textContent =
    `tick ${snapshot.tick.toLocaleString()}` + (m.paused ? ' · paused' : '') +
    (m.speed && m.speed !== 1 ? ` · ${m.speed}× speed` : '');
  document.getElementById('foot').textContent =
    `mod ${m.modVersion} · evolution ${(m.evolution || 0).toFixed(1)}% · ${names.length} surfaces`;

  if (section !== 'production') return;

  // The graph series for this surface, window and kind. "all" is a cumulative
  // count rather than a sampled window, so the game hides the graphs there too.
  const bucket = (history[surface] || {})[selectedWindow] || {};
  const panels = bucket[kind === 'fluids' ? 'fluids' : 'items'] || { produced: {}, consumed: {} };

  for (const panel of ['produced', 'consumed']) {
    const series = isTotals ? {} : (panels[panel] || {});
    const entries = filterEntries(topEntries(flows[panel], TOP_N), search[panel]);
    // Colour by the series present, so a slot's key matches its line.
    const slotOf = new Map();
    assignSlots(`${surface}|${kind}|${panel}`, Object.keys(series)).forEach((slot, i) => {
      slotOf.set(Object.keys(series)[i], slot);
    });

    // A selection can outlive the data it names — switching window or kind, or
    // an item dropping out of the top ten. Drop what is no longer plottable so
    // the reset button never appears for a filter that does nothing.
    for (const name of [...selected]) {
      if (!(name in series)) selected.delete(name);
    }

    const empty = renderChart(panel, series, selectedWindow, slotOf, selected,
      isTotals ? 'Cumulative totals have no graph; pick a timespan for the shape over time.' : null);
    renderTip(panel, series, selectedWindow, slotOf);
    renderSlots(document.getElementById(panel), entries, fmt, panel, slotOf, selected);

    document.querySelector(`.reset[data-reset="${panel}"]`).hidden = selected.size === 0;

  }
}

document.getElementById('sections').addEventListener('click', (event) => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  section = tab.dataset.section;
  hoverIndex = null;
  hovered = null;
  render();
});

document.getElementById('tabs').addEventListener('click', (event) => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  surface = tab.dataset.surface;
  hoverIndex = null;
  hovered = null;
  render();
});

document.getElementById('windows').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-window]');
  if (!button) return;
  selectedWindow = button.dataset.window;
  hoverIndex = null;
  render();
});

document.getElementById('kinds').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-kind]');
  if (!button) return;
  kind = button.dataset.kind;
  // Items and fluids are different sets of names, so a filter cannot carry over.
  selected.clear();
  hoverIndex = null;
  hovered = null;
  render();
});

// Clicking a slot filters the graph to it; clicking again drops it. Additive,
// no modifier, which is how the game does it. Rows with no series behind them
// are inert rather than silently doing nothing.
for (const panel of ['produced', 'consumed']) {
  const list = document.getElementById(panel);

  list.addEventListener('click', (event) => {
    const row = event.target.closest('.bar-row');
    if (!row || row.classList.contains('no-series')) return;
    const item = row.dataset.item;
    if (selected.has(item)) selected.delete(item);
    else selected.add(item);
    render();
  });

  // Hover highlights the line without removing the others - the behaviour the
  // game added in 2.0.7, and separate from clicking.
  list.addEventListener('mouseover', (event) => {
    const row = event.target.closest('.bar-row');
    if (!row || row.classList.contains('no-series')) return;
    if (hovered === row.dataset.item) return;
    hovered = row.dataset.item;
    render();
  });

  list.addEventListener('mouseleave', () => {
    if (hovered === null) return;
    hovered = null;
    render();
  });
}

// The magnifier reveals the field; the field filters as it is typed into.
// Escape, or emptying it, puts it away again.
for (const button of document.querySelectorAll('.search-toggle')) {
  button.addEventListener('click', () => {
    const key = button.dataset.search;
    const input = document.querySelector(`.search-input[data-search-input="${key}"]`);
    input.hidden = !input.hidden;
    if (input.hidden) {
      search[key] = '';
      input.value = '';
      render();
    } else {
      input.focus();
    }
  });
}

for (const input of document.querySelectorAll('.search-input')) {
  input.addEventListener('input', () => {
    search[input.dataset.searchInput] = input.value.trim();
    render();
  });
  input.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    search[input.dataset.searchInput] = '';
    input.value = '';
    input.hidden = true;
    render();
  });
}

document.getElementById('network').addEventListener('change', (event) => {
  logisticNetwork = event.target.value;
  render();
});

for (const button of document.querySelectorAll('.reset')) {
  button.addEventListener('click', () => {
    selected.clear();
    render();
  });
}

// Crosshair: the hit target is the whole plot, not the 2px line.
for (const panel of ['produced', 'consumed']) {
  const chart = document.getElementById(`chart-${panel}`);

  chart.addEventListener('mousemove', (event) => {
    const box = chart.getBoundingClientRect();
    const points = Number(chart.dataset.points || 0);
    if (!points) return;
    const L = 46 / 600 * box.width;
    const plot = (600 - 46 - 8) / 600 * box.width;
    const frac = (event.clientX - box.left - L) / plot;
    const next = Math.round(Math.min(1, Math.max(0, frac)) * (points - 1));
    if (next === hoverIndex && hoverPanel === panel) return;
    hoverIndex = next;
    hoverPanel = panel;
    render();
  });

  chart.addEventListener('mouseleave', () => {
    if (hoverIndex === null) return;
    hoverIndex = null;
    hoverPanel = null;
    render();
  });
}

// ---- server target --------------------------------------------------------

// The page is not always served by the sidecar: on a static host it has no API
// of its own, so the base URL cannot be assumed to be the page's own origin.
// The target therefore comes from the URL, or from servers.json fetched next to
// the page. An empty url means same-origin - what happens when the sidecar
// serves this page itself, which is why that is also the fallback.
const DEFAULT_TARGETS = [{ id: 'local', label: 'Local sidecar', url: '' }];

let targets = DEFAULT_TARGETS;
let target = DEFAULT_TARGETS[0];
let stream = null;

// A trailing slash would double up against the '/api/...' paths.
const normaliseBase = (url) => String(url || '').replace(/\/+$/, '');

const api = (path) => target.url + path;

// /target/<host>, /target/<host:port>, /target/<host>/<base-path>, or a whole
// URL. A bare host gets https: this page is served over https, so a plain http
// sidecar would be blocked as mixed content long before it answered. Put the
// sidecar behind a tunnel or a proxy that terminates TLS.
function parsePathTarget() {
  const match = location.pathname.match(/^\/target\/(.+)$/);
  if (!match) return null;

  // Both the decode and the parse are inside the try. A truncated link -
  // /target/my-sidecar%2, easily produced by a chat client - makes
  // decodeURIComponent throw, and that throw would otherwise escape through
  // loadTargets into boot(), which awaits it with no catch: connect() would
  // never run, and the page would sit on "connecting…" with no reconnect and no
  // hint, because every path that could explain the state is downstream of it.
  let url;
  try {
    let spec = decodeURIComponent(match[1]).replace(/\/+$/, '');
    if (!spec) return null;

    // Browsers collapse a doubled slash inside a path, so a scheme written into
    // /target/ arrives as "http:/host". Put the slash back before parsing, or
    // the host would come out as "http".
    spec = spec.replace(/^(https?):\/+/i, '$1://');
    if (!/^https?:\/\//i.test(spec)) spec = 'https://' + spec;

    url = new URL(spec);
  } catch {
    return null; // not a host at all; fall through to the normal resolution
  }

  // Keep any path, so a sidecar proxied under a prefix still works.
  const suffix = url.pathname === '/' ? '' : url.pathname;
  return { id: 'path', label: url.host + suffix, url: normaliseBase(url.origin + suffix) };
}

async function loadTargets() {
  // The URL wins over everything: a link has to be able to name its server.
  const fromPath = parsePathTarget();
  if (fromPath) return [fromPath];

  // ?api=<url> is the same idea without the path routing, for hosts that cannot
  // serve one page from many paths.
  const adhoc = new URLSearchParams(location.search).get('api');
  if (adhoc) return [{ id: 'custom', label: adhoc, url: normaliseBase(adhoc) }];

  let list;
  try {
    // Absolute: under /target/... a relative fetch would look one level down.
    const res = await fetch('/servers.json', { cache: 'no-store' });
    if (!res.ok) return DEFAULT_TARGETS;
    // A single-page host answers 200 with index.html for a missing file, so
    // the parse is as much of a check as the status is.
    list = await res.json();
  } catch {
    return DEFAULT_TARGETS;
  }

  const clean = (Array.isArray(list) ? list : [])
    .filter((s) => s && s.id)
    .map((s) => ({ id: String(s.id), label: String(s.label || s.id), url: normaliseBase(s.url) }));
  return clean.length ? clean : DEFAULT_TARGETS;
}

// ?server=<id> wins over the last choice, so a link can pin one server.
function pickTarget() {
  const wanted = new URLSearchParams(location.search).get('server') || remembered();
  return targets.find((t) => t.id === wanted) || targets[0];
}

// Private-mode browsers throw on storage rather than returning null.
function remembered() {
  try { return localStorage.getItem('fb.server'); } catch { return null; }
}

function remember(id) {
  try { localStorage.setItem('fb.server', id); } catch { /* not fatal */ }
}

function renderTargets() {
  const select = document.getElementById('server');
  select.hidden = targets.length < 2;
  select.replaceChildren(...targets.map((t) => {
    const option = document.createElement('option');
    option.value = t.id;
    option.textContent = t.label;
    option.selected = t.id === target.id;
    return option;
  }));

  // With one target there is no picker, but on a static host the reader still
  // needs to know which server they are looking at.
  const note = document.getElementById('target-note');
  note.textContent = targets.length < 2 && target.url ? target.label : '';
}

// Nothing survives a switch: ticks, surfaces and colour slots all belong to the
// game that was being watched, and a stale panel next to a new server misleads.
function clearView() {
  const ids = ['tiles', 'tabs', 'windows', 'produced', 'consumed',
    'power', 'logistics', 'chart-produced', 'chart-consumed'];
  for (const id of ids) document.getElementById(id).innerHTML = '';
  for (const panel of ['produced', 'consumed']) {
    document.getElementById(`tip-${panel}`).hidden = true;
    // A filter names items on the server being left; it means nothing on the next.
    selected.clear();
    document.querySelector(`.reset[data-reset="${panel}"]`).hidden = true;
  }
  hovered = null;
  hoverPanel = null;
  document.getElementById('clock').textContent = '—';
  // The identity belongs to the server being left, heading and title included.
  document.getElementById('title').textContent = 'Factorio Broadcast';
  document.title = 'Factorio Broadcast';
  document.getElementById('subtitle').hidden = true;
  document.getElementById('mods').replaceChildren();
  document.getElementById('window-note').textContent = '';
  document.getElementById('foot').textContent = '—';
}

function selectTarget(id) {
  const next = targets.find((t) => t.id === id);
  if (!next || next.id === target.id) return;
  target = next;
  remember(target.id);

  if (stream) stream.close();
  stream = null;
  snapshot = null;
  surface = null;
  selectedWindow = null;
  lastTick = null;
  lastProgressAt = 0;
  streamOpen = false;
  hoverIndex = null;
  colourSlots.clear();
  history = {};
  clearView();
  setStatus('', 'connecting…');
  connect();
}

document.getElementById('server').addEventListener('change', (event) => {
  selectTarget(event.target.value);
});

// A statically hosted page has no API of its own, so the same-origin fallback is
// a dead end until the URL names a sidecar. Say that, rather than spinning on
// "reconnecting" forever. Built as nodes, never markup: the host comes out of
// the address bar and must not be able to write HTML into the page.
function showSetupHint() {
  const tile = document.createElement('div');
  tile.className = 'tile wide';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'No sidecar reachable';

  const where = document.createElement('code');
  where.textContent = (target.url || location.origin) + '/api/stream';
  const how = document.createElement('code');
  how.textContent = location.origin + '/target/<sidecar-host>';

  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.append('Nothing answered at ', where, '. Name a sidecar in the URL: ', how,
    ' — it has to be reachable over https, so put it behind a tunnel rather than opening a port.');

  tile.append(label, sub);
  document.getElementById('tiles').replaceChildren(tile);
}

// ---- transport ------------------------------------------------------------

function setStatus(cls, text) {
  document.getElementById('dot').className = 'dot ' + cls;
  document.getElementById('conn').textContent = text;
}

/**
 * Fold a frame into the one before it.
 *
 * A frame marked `partial` carries only the statistics windows that actually
 * changed this second — the 1h-to-1000h averages are refreshed by the mod every
 * thirtieth snapshot, and re-sending them the other twenty-nine times was over
 * half the payload. Everything outside items and fluids is current every frame
 * and replaces outright; those two merge window by window.
 *
 * The first frame after connecting is never partial, so there is always a
 * complete picture underneath.
 */
function merge(previous, frame) {
  if (!frame.partial || !previous) return frame;

  const surfaces = { ...previous.surfaces };
  for (const [name, fresh] of Object.entries(frame.surfaces || {})) {
    const old = surfaces[name];
    surfaces[name] = !old ? fresh : {
      ...fresh,
      items: { ...old.items, ...fresh.items },
      fluids: { ...old.fluids, ...fresh.fluids },
    };
  }
  return { ...frame, surfaces };
}

function connect() {
  const source = new EventSource(api('/api/stream'));
  stream = source;

  // History arrives on its own event: it is the bulk of the payload and changes
  // once every few seconds, for one surface and window at a time, so it is sent
  // in full on connect and as a slice thereafter. Merged per surface so a slice
  // never drops the windows it does not mention.
  source.addEventListener('history', (event) => {
    if (stream !== source) return;
    try {
      for (const [surface, windows] of Object.entries(JSON.parse(event.data))) {
        history[surface] = Object.assign(history[surface] || {}, windows);
      }
      if (snapshot) render();
    } catch (err) {
      /* a malformed slice must not take the snapshot stream down with it */
    }
  });

  source.onmessage = (event) => {
    if (stream !== source) return; // superseded by a target switch
    try {
      snapshot = merge(snapshot, JSON.parse(event.data));
      // A frame arriving is not the same as the game running. The sidecar
      // replays its last snapshot to every stream that connects, so a paused
      // server hands out a fresh-looking frame each time the connection is
      // remade — carrying the tick it was written at. Progress is the tick
      // moving, and nothing else.
      if (snapshot.tick !== lastTick) {
        lastTick = snapshot.tick;
        const now = Date.now();
        if (lastProgressAt) noteGap(now - lastProgressAt);
        // A page opened onto a server that paused an hour ago would otherwise
        // count from its own load and claim the data was seconds old. The
        // sidecar stamps receivedAt when it read the file, within a poll of
        // when the mod wrote it, so the first frame is dated from that instead.
        // Only the first: the two clocks are independent, and letting skew into
        // every frame would make a running server look permanently behind.
        lastProgressAt = lastProgressAt ? now : stampedAt(snapshot);
      }
      render();
      updateStatus();
    } catch (err) {
      setStatus('down', 'bad frame');
    }
  };

  source.onopen = () => {
    if (stream !== source) return;
    streamOpen = true;
    updateStatus();
  };

  source.onerror = () => {
    if (stream !== source) return;
    streamOpen = false;
    setStatus('down', 'reconnecting…');
    // Never connected at all: the target is wrong, not merely down.
    if (!snapshot) showSetupHint();
    source.close();
    setTimeout(() => {
      if (stream === source) connect();
    }, 2000);
  };
}

/**
 * When the sidecar read this snapshot off disk, in local time — or now, if that
 * stamp is unusable. Only a stamp in the future is rejected, which means the
 * browser's clock is ahead of the server's. A large age is NOT rejected: a
 * server paused since yesterday genuinely is a day old, and an upper bound here
 * would hand exactly that case back to the bug this whole scheme exists to fix.
 */
function stampedAt(snap) {
  const stamped = Number(snap && snap.receivedAt);
  const now = Date.now();
  if (!Number.isFinite(stamped)) return now;
  return stamped <= now ? stamped : now;
}

/** 83_000 -> "83s"; 145_000 -> "2m 25s"; an overnight pause -> "9h 12m". */
function duration(ms) {
  const total = Math.round(ms / 1000);
  if (total < 60) return total + 's';
  const minutes = Math.floor(total / 60);
  if (minutes < 60) return minutes + 'm ' + (total % 60) + 's';
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return hours + 'h ' + (minutes % 60) + 'm';
  return Math.floor(hours / 24) + 'd ' + (hours % 24) + 'h';
}

// One snapshot per second is a coincidence of the defaults, not a property of
// the system. The mod emits one every fb-interval-ticks GAME ticks — an admin
// setting, 6 to 3600, default 60 — so the wall-clock gap is interval/UPS
// seconds, and UPS is itself scaled by game.speed. A megabase at 20 UPS on the
// default interval sends a frame every three seconds; an interval of 300 sends
// one every five. Fixed thresholds would paint every one of those as lagging,
// while the UPS tile beside them says the server is fine. Nothing in the
// payload carries the interval, so the page measures the cadence it is
// actually being given.
const GAP_SAMPLES = 8;
const ASSUMED_GAP_MS = 5000; // before enough samples, err towards "running"
const gaps = [];

function noteGap(ms) {
  if (!(ms > 0)) return;
  gaps.push(ms);
  if (gaps.length > GAP_SAMPLES) gaps.shift();
}

/** The median, so one long gap out of a pause cannot stretch the whole scale. */
function expectedGap() {
  if (gaps.length < 3) return ASSUMED_GAP_MS;
  const sorted = gaps.slice().sort((a, b) => a - b);
  const mid = sorted[Math.floor(sorted.length / 2)];
  return Math.min(120000, Math.max(1000, mid));
}

// Three different silences, and they are not the same news:
//
//   the stream is down          the sidecar or the tunnel is unreachable
//   stream up, tick frozen      the sidecar answers but the game is not ticking
//   stream up, tick moving      running
//
// The middle case is what auto_pause produces once the last player leaves. It
// cannot be told apart from a mod that stopped reporting while the game ran, so
// the wording only claims what is actually observed until the silence is long
// enough that a network hiccup is no longer a plausible reading.
//
// Every threshold is a multiple of the measured cadence, never a fixed number of
// seconds. At the default one-second cadence they work out at 2.5 s, 5 s and
// 10 s; on a server sending every five seconds they scale with it.
function updateStatus() {
  if (!streamOpen) return;    // onerror owns the message while reconnecting
  if (!lastProgressAt) return; // nothing has arrived yet; still "connecting…"

  const idle = Date.now() - lastProgressAt;
  const gap = expectedGap();
  if (idle < gap * 2.5) setStatus('live', 'live');
  else if (idle < gap * 5) setStatus('stale', 'lagging');
  else if (idle < gap * 10) setStatus('stale', `no data for ${duration(idle)}`);
  else setStatus('paused', `paused · ${duration(idle)}`);
}

setInterval(updateStatus, 1000);

(async function boot() {
  targets = await loadTargets();
  target = pickTarget();
  renderTargets();
  connect();
})();

// ---- dot-matrix accent ----------------------------------------------------

// An inset field of dots on an orthographic camera, breathing on a 2 s cycle
// and drifting a little towards the pointer. Everything here is ornament: the
// container already paints a CSS dot grid, so if Three.js never arrives, or the
// reader asked for reduced motion, that grid is what stays on screen.
(function dotMatrix() {
  const container = document.getElementById('webgl-container');
  if (!container) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  script.async = true;
  script.onerror = () => { /* CSS dot grid remains */ };
  script.onload = () => { try { start(window.THREE); } catch { /* ornament only */ } };
  document.head.appendChild(script);

  function start(THREE) {
    if (!THREE) return;
    const width = container.clientWidth;
    const height = container.clientHeight;
    if (!width || !height) return;

    const scene = new THREE.Scene();
    const aspect = width / height;
    const d = 14;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    camera.position.set(20, 20, 20);
    camera.lookAt(scene.position);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // A flat lattice in the xz plane. Sparse, per the design note - the gaps
    // are what make it read as a matrix rather than a texture.
    const SIDE = 40, STEP = 0.9;
    const positions = new Float32Array(SIDE * SIDE * 3);
    let i = 0;
    for (let a = 0; a < SIDE; a++) {
      for (let b = 0; b < SIDE; b++) {
        positions[i++] = (a - SIDE / 2) * STEP;
        positions[i++] = 0;
        positions[i++] = (b - SIDE / 2) * STEP;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Written as a shader rather than PointsMaterial so each dot can fade with
    // depth on its own - the "soft depth fade" the effect is built from.
    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x00E5FF) },
      },
      vertexShader: `
        uniform float uTime;
        varying float vFade;
        void main() {
          vec3 p = position;
          // Breathing pulse: one slow wave crossing the lattice.
          float wave = sin(length(p.xz) * 0.35 - uTime * 3.1415);
          p.y = wave * 1.1;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = 2.2;
          // Nearer dots are brighter; the wave crest brightens too.
          vFade = clamp(0.18 + wave * 0.28 + (mv.z + 24.0) / 48.0 * 0.55, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vFade;
        void main() {
          // Round dots, not squares.
          vec2 c = gl_PointCoord - vec2(0.5);
          if (dot(c, c) > 0.25) discard;
          gl_FragColor = vec4(uColor, vFade);
        }
      `,
    });

    scene.add(new THREE.Points(geometry, material));

    // Pointer parallax, deliberately understated: a drift, not a camera rig.
    let px = 0, py = 0, tx = 0, ty = 0;
    container.addEventListener('pointermove', (event) => {
      const box = container.getBoundingClientRect();
      tx = ((event.clientX - box.left) / box.width - 0.5) * 2.5;
      ty = ((event.clientY - box.top) / box.height - 0.5) * 2.5;
    });
    container.addEventListener('pointerleave', () => { tx = 0; ty = 0; });

    const t0 = performance.now();
    (function frame(now) {
      requestAnimationFrame(frame);
      // A hidden tab still fires rAF in some browsers; skip the work anyway.
      if (document.hidden) return;
      px += (tx - px) * 0.05;
      py += (ty - py) * 0.05;
      // 2000 ms, the documented long beat.
      material.uniforms.uTime.value = ((now - t0) % 2000) / 2000;
      camera.position.set(20 + px, 20 - py, 20 - px);
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    })(t0);

    window.addEventListener('resize', () => {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      const a = w / h;
      camera.left = -d * a; camera.right = d * a;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  }
})();
</script>
</body>
</html>
