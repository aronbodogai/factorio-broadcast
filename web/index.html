<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factorio Broadcast</title>

<!-- Bricolage Grotesque carries the display hierarchy; everything else is the
     system stack, so the page renders correctly before the font arrives. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&display=swap">

<style>
/* ===========================================================================
   Nexus Core tokens (DESIGN.md).

   Dark only. The token table lists both "#0A0A0A as the neutral foundation for
   backgrounds" and "Background: #00E5FF"; the second reading would put a
   saturated cyan behind nine thousand digits of production data, so the page
   takes the first and spends cyan on accent, text-secondary and glow instead.
   =========================================================================== */
:root {
  color-scheme: dark;

  --primary:        #00E5FF;
  --tertiary:       #0A3BFF;
  --neutral:        #0A0A0A;
  --page:           #0A0A0A;
  --text-primary:   #FFFFFF;
  --text-secondary: #00E5FF;
  --text-muted:     rgba(255, 255, 255, 0.55);
  --border:         rgba(255, 255, 255, 0.2);
  --border-strong:  #FFFFFF;

  /* Glass: a white wash falling to nothing, the documented
     bg-gradient-to-b from-white/20 to-transparent, thinned for large areas. */
  --glass:          linear-gradient(to bottom, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
  --glass-strong:   linear-gradient(to bottom, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.02));
  --track:          rgba(255, 255, 255, 0.08);
  --blur:           4px;

  --shadow-card:    rgba(0, 0, 0, 0.25) 0 25px 50px -12px;
  --glow:           rgb(0, 229, 255) 0 0 8px 0;

  /* 4px base rhythm; every gap below steps through this scale. */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-14: 56px;

  --r-sm: 2px; --r-md: 4px; --r-lg: 20px; --r-pill: 9999px;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;

  --dur: 150ms;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);

  /* Five overlapping lines need five separable colours, and the palette offers
     two hues. Rather than invent a third, the ramp is shades and tints of the
     cyan and the blue plus white, separated by lightness — which survives the
     overlap better than neighbouring hues do, and reads for the colour-blind.
     The legend names every series regardless: identity is never colour alone. */
  --series-1: #00E5FF;
  --series-2: #FFFFFF;
  --series-3: #0A3BFF;
  --series-4: #00808F;
  --series-5: #8C9BFF;

  /* Power satisfaction is a semantic state, the one case the palette rules
     admit. Kept desaturated so it never competes with the cyan accent. */
  --good:     #3DDC97;
  --warning:  #FFB020;
  --critical: #FF5C5C;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 400 14px/22.75px system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* The grid is the frame: a bounded column, everything inside it on the same
   4px cadence. */
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--s-8) var(--s-8) var(--s-14);
}

@media (max-width: 720px) {
  .wrap { padding: var(--s-4) var(--s-4) var(--s-8); }
}

/* ---- shared surfaces ---------------------------------------------------- */

.card {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: var(--s-8);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-card);
}

@media (max-width: 720px) {
  .card { padding: var(--s-5); }
}

h2 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin: 0 0 var(--s-1);
}

.hint {
  font-size: 12px;
  line-height: 16px;
  color: var(--text-muted);
  margin-bottom: var(--s-5);
}

.meta {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 16px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.empty { font-size: 12px; color: var(--text-muted); padding: var(--s-2) 0; }

/* ---- hero --------------------------------------------------------------- */

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: var(--s-8);
  align-items: stretch;
  margin-bottom: var(--s-8);
}

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-visual { display: none; }
}

.hero-text {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s-4);
}

h1 {
  font-family: var(--display);
  font-size: 52px;
  font-weight: 300;
  line-height: 52px;
  letter-spacing: -0.05em;
  text-transform: uppercase;
  margin: 0;
}

@media (max-width: 720px) {
  h1 { font-size: 36px; line-height: 36px; }
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-wrap: wrap;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-left: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  padding: var(--s-1) var(--s-3);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--text-muted);
}
.dot.live     { background: var(--primary); box-shadow: var(--glow); }
.dot.stale    { background: var(--warning); }
.dot.down     { background: var(--critical); }

/* Sidecar picker. Hidden unless servers.json lists more than one target. */
.target {
  appearance: none;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-1) var(--s-2);
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.target:hover { color: var(--text-primary); border-color: var(--border-strong); }
.target option { background: var(--neutral); color: var(--text-primary); }
/* A UA display rule on <select> outranks the plain hidden attribute. */
.target[hidden] { display: none; }

/* The dot-matrix accent. The CSS grid underneath is the fallback: it is what
   shows when WebGL is unavailable, the library fails to load, or the reader
   asked for reduced motion. */
.hero-visual {
  position: relative;
  min-height: 168px;
  border: 1px solid var(--border);
  background:
    radial-gradient(circle at center, rgba(0, 229, 255, 0.6) 0.5px, transparent 0.5px) 0 0 / 12px 12px,
    var(--glass);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.hero-visual canvas { position: absolute; top: 0; left: 0; display: block; }
.hero-visual::after {
  /* Soft depth fade, kept in CSS so it applies to both renderings. */
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(10, 10, 10, 0) 40%, rgba(10, 10, 10, 0.85));
  pointer-events: none;
}

/* ---- KPI grid ----------------------------------------------------------- */

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--s-2);
  margin-bottom: var(--s-8);
}

.tile {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 0;
  padding: var(--s-6);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  transition: border-color var(--dur) var(--ease);
}
.tile:hover { border-color: var(--border-strong); }
.tile.wide { grid-column: 1 / -1; }

.tile .label {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: var(--s-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile .value {
  font-family: var(--display);
  font-size: 36px;
  font-weight: 300;
  line-height: 40px;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  /* "137.8 MW" has to stay on one line; wrapped, the unit reads as a second
     number stacked under the first. */
  white-space: nowrap;
}
.tile .sub { font-size: 12px; line-height: 16px; color: var(--text-muted); margin-top: var(--s-2); }
.tile code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--track);
  border-radius: var(--r-sm);
  padding: 1px 5px;
  word-break: break-all;
  color: var(--text-secondary);
}

/* ---- surface tabs ------------------------------------------------------- */

.tabs {
  display: flex;
  gap: var(--s-1);
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--s-5);
}

.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: var(--s-3) var(--s-4);
  cursor: pointer;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.tab .count { color: var(--text-muted); font-weight: 400; margin-left: var(--s-1); }

/* ---- window filter ------------------------------------------------------ */

.filters {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex-wrap: wrap;
  margin-bottom: var(--s-5);
}

.filters .label {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.seg { display: inline-flex; gap: var(--s-1); flex-wrap: wrap; }

.seg button {
  appearance: none;
  background: transparent;
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-2);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  letter-spacing: 1.2px;
  cursor: pointer;
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease),
              border-color var(--dur) var(--ease);
}
.seg button:hover { border-color: var(--border-strong); }
.seg button[aria-pressed="true"] {
  background: var(--primary);
  border-color: var(--primary);
  color: #000000;
}

/* ---- chart -------------------------------------------------------------- */

.chart-wrap { position: relative; }

.chart { width: 100%; height: auto; display: block; }
.chart.is-empty { display: none; }

.chart .grid       { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; }
.chart .axis       { stroke: var(--border); stroke-width: 1; }
.chart .line       { fill: none; stroke-width: 2; }
.chart .crosshair  { stroke: var(--primary); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .tick-label {
  fill: var(--text-muted);
  font-family: var(--mono);
  font-size: 10px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-3);
  margin-top: var(--s-3);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
}
.legend-item { display: inline-flex; align-items: center; gap: var(--s-2); }
.swatch { width: 8px; height: 8px; border-radius: var(--r-sm); flex: none; }

.tip {
  position: absolute;
  pointer-events: none;
  background: rgba(10, 10, 10, 0.9);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--s-2) var(--s-3);
  font-family: var(--mono);
  font-size: 11px;
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: var(--shadow-card);
  white-space: nowrap;
  z-index: 2;
}
.tip .when { color: var(--text-secondary); margin-bottom: var(--s-1); }
.tip .row { display: flex; align-items: center; gap: var(--s-2); }
.tip .row .v { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ---- bars --------------------------------------------------------------- */

.bars { display: flex; flex-direction: column; gap: var(--s-2); }

.bar-row {
  display: grid;
  grid-template-columns: minmax(0, 128px) 1fr auto;
  align-items: center;
  gap: var(--s-3);
  font-size: 12px;
  line-height: 16px;
}
.bar-name {
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track { background: var(--track); height: 6px; border-radius: var(--r-sm); overflow: hidden; }
.bar-fill {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: var(--r-sm);
  transition: width var(--dur) var(--ease);
}
.bar-fill.alt { background: var(--tertiary); }
.bar-value {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.bar-group {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: var(--s-4) 0 var(--s-2);
}

/* ---- electric networks -------------------------------------------------- */

.net + .net { margin-top: var(--s-6); border-top: 1px solid var(--border); padding-top: var(--s-6); }

.net-head {
  display: flex;
  align-items: baseline;
  gap: var(--s-3);
  flex-wrap: wrap;
  margin-bottom: var(--s-2);
}
.net-title {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.net-nums { font-family: var(--mono); font-size: 12px; color: var(--text-muted); margin-left: auto; }

.sat {
  font-family: var(--mono);
  font-size: 11px;
  border-radius: var(--r-pill);
  border: 1px solid currentColor;
  padding: 0 var(--s-2);
}
.sat.good     { color: var(--good); }
.sat.warning  { color: var(--warning); }
.sat.critical { color: var(--critical); }

/* ---- tables ------------------------------------------------------------- */

table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: var(--s-1) var(--s-2) var(--s-1) 0; border-bottom: 1px solid var(--track); }
th {
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

details { margin-top: var(--s-5); }
summary {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-secondary);
  cursor: pointer;
}
.scroll { overflow-x: auto; }

/* ---- layout ------------------------------------------------------------- */

.stack { display: grid; gap: var(--s-2); }

.grid2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: var(--s-2);
}

footer {
  margin-top: var(--s-8);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-text">
      <h1>Factorio Broadcast</h1>
      <div class="hero-meta">
        <span class="meta" id="clock">—</span>
        <select class="target" id="server" aria-label="Server" hidden></select>
        <span class="meta" id="target-note"></span>
        <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
      </div>
    </div>
    <div class="hero-visual" id="webgl-container" aria-hidden="true"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="filters">
    <span class="label">Window</span>
    <span class="seg" id="windows"></span>
    <span class="meta" id="window-note"></span>
  </div>

  <div class="stack">
    <section class="card">
      <h2>Production over time</h2>
      <div class="hint" id="chart-hint">the game's own graph samples</div>
      <div class="chart-wrap" id="chart-wrap">
        <svg class="chart" id="chart" viewBox="0 0 600 210" role="img" aria-label="Production over time"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="legend" id="chart-legend"></div>
      <details>
        <summary>Table view</summary>
        <div class="scroll"><table id="chart-table"></table></div>
      </details>
    </section>

    <div class="grid2">
      <section class="card">
        <h2>Electricity</h2>
        <div class="hint" id="power-hint">per electric network</div>
        <div id="power"></div>
      </section>

      <section class="card">
        <h2>Items produced</h2>
        <div class="hint window-hint">per minute</div>
        <div class="bars" id="produced"></div>
        <details>
          <summary>Table view</summary>
          <div class="scroll"><table id="produced-table"></table></div>
        </details>
      </section>

      <section class="card">
        <h2>Items consumed</h2>
        <div class="hint window-hint">per minute</div>
        <div class="bars" id="consumed"></div>
        <details>
          <summary>Table view</summary>
          <div class="scroll"><table id="consumed-table"></table></div>
        </details>
      </section>

      <section class="card">
        <h2>Fluids produced</h2>
        <div class="hint window-hint">per minute</div>
        <div class="bars" id="fluids"></div>
      </section>
    </div>
  </div>

  <footer id="foot">—</footer>
</div>

<script>
'use strict';

const TOP_N = 12;
const CHART_SERIES = 5;

// How much wall-clock each statistics window covers. Each window holds 300
// samples spread across this span.
const WINDOW_SPAN = {
  '5s': '5 s', '1m': '1 min', '10m': '10 min', '1h': '1 h',
  '10h': '10 h', '50h': '50 h', '250h': '250 h', '1000h': '1000 h',
  all: 'all time',
};

// "all" is a cumulative count, not a per-minute rate, so it formats and labels
// differently everywhere it appears.
const TOTALS_WINDOW = 'all';

let snapshot = null;
let surface = null;
let selectedWindow = null;
let lastAt = 0;
let hoverIndex = null;

// ---- formatting -----------------------------------------------------------

function watts(w) {
  const abs = Math.abs(w);
  if (abs >= 1e9) return (w / 1e9).toFixed(1) + ' GW';
  if (abs >= 1e6) return (w / 1e6).toFixed(1) + ' MW';
  if (abs >= 1e3) return (w / 1e3).toFixed(1) + ' kW';
  return Math.round(w) + ' W';
}

function rate(n) {
  if (n >= 1000) return Math.round(n).toLocaleString();
  if (n >= 100) return n.toFixed(0);
  if (n >= 10) return n.toFixed(1);
  return n.toFixed(2);
}

function count(n) {
  return Math.round(n).toLocaleString();
}

/** Axis ticks are compact, not precise: 0, 12k, 1.2M. */
function axisLabel(v) {
  if (v === 0) return '0';
  if (v >= 1e6) return (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'k';
  return String(Math.round(v));
}

function pretty(name) {
  return name.replace(/-/g, ' ').replace(/^./, (c) => c.toUpperCase());
}

// ---- rendering ------------------------------------------------------------

function tile(label, value, sub) {
  return `<div class="tile">
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ''}
  </div>`;
}

/** Ranked horizontal bars. One series per chart, so the title is the legend. */
function renderBars(el, entries, format, alt) {
  if (!entries.length) {
    el.innerHTML = '<div class="empty">Nothing recorded in this window.</div>';
    return;
  }
  const max = entries[0][1];
  el.innerHTML = entries.map(([name, value]) => {
    const pct = max > 0 ? Math.max(1.5, (value / max) * 100) : 0;
    return `<div class="bar-row" title="${pretty(name)}: ${format(value)}">
      <span class="bar-name">${pretty(name)}</span>
      <span class="bar-track"><span class="bar-fill${alt ? ' alt' : ''}" style="width:${pct}%"></span></span>
      <span class="bar-value">${format(value)}</span>
    </div>`;
  }).join('');
}

function renderTable(el, entries, unit, format) {
  if (!entries.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<thead><tr><th>Item</th><th class="num">${unit}</th></tr></thead><tbody>` +
    entries.map(([n, v]) => `<tr><td>${pretty(n)}</td><td class="num">${(format || rate)(v)}</td></tr>`).join('') +
    '</tbody>';
}

/**
 * Science is the headline number, and it is not one number.
 *
 *   spm    research units per minute - what "1k SPM" means in the community.
 *          A unit needs the whole ingredient list, so the rate is set by the
 *          scarcest pack: min over ingredients of consumed/amount.
 *   packs  every science pack consumed per minute, added up. Always the larger
 *          figure, and the one that moves when you add a pack type.
 *
 * Both are summed across surfaces first: labs can sit on any planet.
 */
function scienceRates(snapshot, window) {
  const consumed = {};
  for (const surface of Object.values(snapshot.surfaces)) {
    const flow = surface.items[window];
    if (!flow) continue;
    for (const [name, value] of Object.entries(flow.consumed)) {
      if (!name.endsWith('science-pack')) continue;
      consumed[name] = (consumed[name] ?? 0) + value;
    }
  }

  const packs = Object.values(consumed).reduce((a, b) => a + b, 0);
  const ingredients = (snapshot.meta.research && snapshot.meta.research.ingredients) || [];

  let spm = null;
  if (ingredients.length) {
    spm = Math.min(...ingredients.map((i) => (consumed[i.name] ?? 0) / (i.amount || 1)));
  } else if (Object.keys(consumed).length) {
    // No research running: fall back to the scarcest pack still being drunk.
    spm = Math.min(...Object.values(consumed));
  }

  return { spm, packs, types: Object.keys(consumed).length };
}

function topEntries(map, n) {
  return Object.entries(map || {})
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n);
}

function satClass(pct) {
  if (pct >= 99) return 'good';
  if (pct >= 90) return 'warning';
  return 'critical';
}

function renderPower(el, networks) {
  const live = networks.filter((n) => n.producedW > 0 || n.consumedW > 0);
  if (!live.length) {
    el.innerHTML = '<div class="empty">No powered network on this surface.</div>';
    return;
  }
  live.sort((a, b) => b.producedW - a.producedW);

  el.innerHTML = live.map((net) => {
    const cls = satClass(net.satisfaction);
    // Icon + label, never colour alone.
    const mark = cls === 'good' ? '✓' : cls === 'warning' ? '!' : '✕';
    const producers = topEntries(net.producersW, 5);
    const consumers = topEntries(net.consumersW, 6);
    const scale = Math.max(
      producers.length ? producers[0][1] : 0,
      consumers.length ? consumers[0][1] : 0,
    );
    const row = (entries, alt) => entries.map(([name, value]) => {
      const pct = scale > 0 ? Math.max(1.5, (value / scale) * 100) : 0;
      return `<div class="bar-row" title="${pretty(name)}: ${watts(value)}">
        <span class="bar-name">${pretty(name)}</span>
        <span class="bar-track"><span class="bar-fill${alt ? ' alt' : ''}" style="width:${pct}%"></span></span>
        <span class="bar-value">${watts(value)}</span>
      </div>`;
    }).join('');

    return `<div class="net">
      <div class="net-head">
        <span class="net-title">Network ${net.id}</span>
        <span class="sat ${cls}">${mark} ${net.satisfaction.toFixed(0)}% satisfied</span>
        <span class="net-nums">${watts(net.producedW)} produced · ${watts(net.consumedW)} drawn</span>
      </div>
      <div class="bar-group">Producing</div>
      <div class="bars">${row(producers, false) || '<div class="empty">—</div>'}</div>
      <div class="bar-group">Drawing</div>
      <div class="bars">${row(consumers, true) || '<div class="empty">—</div>'}</div>
    </div>`;
  }).join('');
}

// Colour follows the item, never its rank: the mod sends whichever items are
// currently busiest, so without this a series would change colour the moment
// two items swapped places.
const colourSlots = new Map();

function assignSlots(surfaceName, names) {
  const key = (n) => `${surfaceName}|${n}`;
  const used = new Set();
  const out = names.map(() => null);

  // Keep an item's existing colour whenever that slot is still free.
  names.forEach((name, i) => {
    const slot = colourSlots.get(key(name));
    if (slot !== undefined && !used.has(slot)) {
      used.add(slot);
      out[i] = slot;
    }
  });

  names.forEach((name, i) => {
    if (out[i] !== null) return;
    let slot = 0;
    while (used.has(slot)) slot++;
    used.add(slot);
    colourSlots.set(key(name), slot);
    out[i] = slot;
  });

  return out;
}

/** Line chart over the game's own 300 graph samples for the selected window. */
function renderChart(series, window, emptyMessage) {
  const svg = document.getElementById('chart');
  const legend = document.getElementById('chart-legend');
  const names = Object.keys(series).slice(0, CHART_SERIES);

  if (!names.length) {
    // Collapse rather than leave the plot's height as dead space.
    svg.innerHTML = '';
    svg.classList.add("is-empty");
    legend.innerHTML = `<div class="empty">${emptyMessage
      || 'No graph samples yet — history is sent every few seconds.'}</div>`;
    document.getElementById('chart-table').innerHTML = '';
    return;
  }
  svg.classList.remove("is-empty");

  const W = 600, H = 210, L = 46, R = 8, T = 10, B = 20;
  const points = Math.max(...names.map((n) => series[n].length));
  const max = Math.max(...names.flatMap((n) => series[n]), 1);
  // Round the top of the scale up to something readable.
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const niceMax = Math.ceil(max / step) * step;

  const x = (i) => L + (i / Math.max(1, points - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / niceMax) * (H - T - B);

  const gridlines = [0, 0.5, 1].map((f) => {
    const value = niceMax * f;
    const yy = y(value);
    return `<line class="grid" x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}"/>
      <text class="tick-label" x="${L - 6}" y="${yy + 3}" text-anchor="end">${axisLabel(value)}</text>`;
  }).join('');

  const slots = assignSlots(surface, names);

  const lines = names.map((name, i) => {
    const values = series[name];
    const d = values.map((v, idx) => `${idx === 0 ? 'M' : 'L'}${x(idx).toFixed(1)},${y(v).toFixed(1)}`).join('');
    return `<path class="line" d="${d}" stroke="var(--series-${slots[i] + 1})" vector-effect="non-scaling-stroke"/>`;
  }).join('');

  const cross = hoverIndex === null ? '' :
    `<line class="crosshair" x1="${x(hoverIndex)}" y1="${T}" x2="${x(hoverIndex)}" y2="${H - B}"/>`;

  svg.innerHTML = `${gridlines}
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>
    ${lines}${cross}
    <text class="tick-label" x="${L}" y="${H - 6}">−${WINDOW_SPAN[window] || window}</text>
    <text class="tick-label" x="${W - R}" y="${H - 6}" text-anchor="end">now</text>`;

  // Identity is never colour-alone: every series is named here, which also
  // provides the relief the palette's near-neighbour hues require.
  legend.innerHTML = names.map((name, i) =>
    `<span class="legend-item"><span class="swatch" style="background:var(--series-${slots[i] + 1})"></span>${pretty(name)}</span>`
  ).join('');

  document.getElementById('chart-table').innerHTML =
    `<thead><tr><th>Item</th><th class="num">Now</th><th class="num">Peak</th><th class="num">Mean</th></tr></thead><tbody>` +
    names.map((n) => {
      const v = series[n];
      const mean = v.reduce((a, b) => a + b, 0) / (v.length || 1);
      return `<tr><td>${pretty(n)}</td><td class="num">${rate(v[v.length - 1] ?? 0)}</td>` +
             `<td class="num">${rate(Math.max(...v))}</td><td class="num">${rate(mean)}</td></tr>`;
    }).join('') + '</tbody>';

  svg.dataset.points = String(points);
  svg.dataset.names = JSON.stringify(names);
  svg.dataset.slots = JSON.stringify(slots);
}

function renderTip(series, window) {
  const tip = document.getElementById('tip');
  const svg = document.getElementById('chart');
  const names = JSON.parse(svg.dataset.names || '[]');
  const slots = JSON.parse(svg.dataset.slots || '[]');
  if (hoverIndex === null || !names.length) { tip.hidden = true; return; }

  const points = Number(svg.dataset.points || 1);
  const ago = points - 1 - hoverIndex;
  tip.hidden = false;
  tip.innerHTML =
    `<div class="when">${ago === 0 ? 'now' : `${((ago / (points - 1)) * 100).toFixed(0)}% of ${WINDOW_SPAN[window] || window} ago`}</div>` +
    names.map((n, i) =>
      `<div class="row"><span class="swatch" style="background:var(--series-${slots[i] + 1})"></span>${pretty(n)}<span class="v">${rate(series[n][hoverIndex] ?? 0)}</span></div>`
    ).join('');

  const wrap = document.getElementById('chart-wrap');
  const frac = hoverIndex / Math.max(1, points - 1);
  const left = 46 / 600 * wrap.clientWidth + frac * ((600 - 46 - 8) / 600) * wrap.clientWidth;
  tip.style.left = Math.min(wrap.clientWidth - tip.offsetWidth - 4, left + 10) + 'px';
  tip.style.top = '6px';
}

function render() {
  if (!snapshot) return;
  const names = snapshot.meta.surfaceNames || Object.keys(snapshot.surfaces);
  if (!surface || !snapshot.surfaces[surface]) surface = names[0];

  // Tabs
  document.getElementById('tabs').innerHTML = names.map((name) => {
    const s = snapshot.surfaces[name];
    const nets = s ? s.power.filter((n) => n.producedW > 0).length : 0;
    return `<button class="tab" role="tab" data-surface="${name}"
      aria-selected="${name === surface}">${pretty(name)}${nets ? `<span class="count">${nets}⚡</span>` : ''}</button>`;
  }).join('');

  const s = snapshot.surfaces[surface];
  const m = snapshot.meta;

  // Totals across every network on this surface.
  const produced = s ? s.power.reduce((a, n) => a + n.producedW, 0) : 0;
  const consumed = s ? s.power.reduce((a, n) => a + n.consumedW, 0) : 0;
  const sat = produced > 0 ? Math.min(100, (consumed / produced) * 100) : 0;
  const research = m.research;

  // Which statistics window the rates and the chart are read from.
  const windows = (m.windows && m.windows.length) ? m.windows : [m.baseWindow || '1m'];
  if (!selectedWindow || !windows.includes(selectedWindow)) selectedWindow = m.baseWindow || windows[0];
  document.getElementById('windows').innerHTML = windows.map((w) =>
    `<button data-window="${w}" aria-pressed="${w === selectedWindow}">${w}</button>`).join('');
  const isTotals = selectedWindow === TOTALS_WINDOW;
  const span = WINDOW_SPAN[selectedWindow] || selectedWindow;
  const fmt = isTotals ? count : rate;

  document.getElementById('window-note').textContent = isTotals
    ? 'cumulative since the save began'
    : `averaged over the last ${span}`;
  for (const hint of document.querySelectorAll('.window-hint')) {
    hint.textContent = isTotals ? 'total ever made' : `per minute, averaged over ${span}`;
  }

  const items = (s && s.items[selectedWindow]) || { produced: {}, consumed: {} };
  const fluids = (s && s.fluids[selectedWindow]) || { produced: {}, consumed: {} };

  // The game exposes no UPS of its own; the sidecar derives it from how far the
  // tick advances per second of wall clock.
  const ups = snapshot.ups;
  const target = 60 * (m.speed || 1);
  const upsSub = ups === null ? 'measuring…'
    : ups >= target - 2 ? `at the ${target} target`
    : `below the ${target} target`;

  // Science is measured over a real window even on the "all" tab, where the
  // figures are lifetime totals and a per-minute rate has no meaning.
  const scienceWindow = isTotals ? (m.baseWindow || '1m') : selectedWindow;
  const science = scienceRates(snapshot, scienceWindow);
  const scienceSpan = WINDOW_SPAN[scienceWindow] || scienceWindow;

  document.getElementById('tiles').innerHTML = [
    tile('SPM', science.spm === null ? '—' : rate(science.spm),
         `research units/min · ${scienceSpan}`),
    tile('Science packs/min', rate(science.packs),
         science.types ? `${science.types} pack types · ${scienceSpan}` : 'no science being consumed'),
    tile('UPS', ups === null ? '—' : ups.toFixed(1), upsSub),
    tile('Power produced', watts(produced), pretty(surface)),
    tile('Power drawn', watts(consumed), sat.toFixed(0) + '% satisfied'),
    tile('Pollution', s ? count(s.pollution) : '0', pretty(surface)),
    tile('Research', research ? Math.round(research.progress) + '%' : '—',
         research ? pretty(research.name) : 'nothing queued'),
    tile('Rockets launched', count(m.rockets || 0), 'all surfaces'),
    tile('Players online', String(m.playersOnline ?? 0),
         (m.players || []).map((p) => p.name).join(', ') || 'nobody connected'),
  ].join('');

  document.getElementById('power-hint').textContent =
    s && s.power.length ? `${s.power.length} network(s) on ${pretty(surface)} · 1m window` : 'per electric network';
  renderPower(document.getElementById('power'), s ? s.power : []);

  const prod = topEntries(items.produced, TOP_N);
  const cons = topEntries(items.consumed, TOP_N);
  const unit = isTotals ? 'total' : 'per minute';
  renderBars(document.getElementById('produced'), prod, fmt, false);
  renderBars(document.getElementById('consumed'), cons, fmt, true);
  renderTable(document.getElementById('produced-table'), prod, unit, fmt);
  renderTable(document.getElementById('consumed-table'), cons, unit, fmt);
  renderBars(document.getElementById('fluids'), topEntries(fluids.produced, 8), fmt, false);

  const series = isTotals ? {} : ((snapshot.history || {})[surface] || {})[selectedWindow] || {};
  document.getElementById('chart-hint').textContent = isTotals
    ? `${pretty(surface)} · cumulative totals have no graph; pick a window for the shape over time`
    : `${pretty(surface)} · the game's own 300 graph samples across ${span}`;
  renderChart(series, selectedWindow,
    isTotals ? 'The game keeps graph samples per window, not for the all-time total.' : null);
  renderTip(series, selectedWindow);

  document.getElementById('clock').textContent =
    `tick ${snapshot.tick.toLocaleString()}` + (m.paused ? ' · paused' : '') +
    (m.speed && m.speed !== 1 ? ` · ${m.speed}× speed` : '');
  document.getElementById('foot').textContent =
    `mod ${m.modVersion} · evolution ${(m.evolution || 0).toFixed(1)}% · ${names.length} surfaces`;
}

document.getElementById('tabs').addEventListener('click', (event) => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  surface = tab.dataset.surface;
  hoverIndex = null;
  render();
});

document.getElementById('windows').addEventListener('click', (event) => {
  const button = event.target.closest('button[data-window]');
  if (!button) return;
  selectedWindow = button.dataset.window;
  hoverIndex = null;
  render();
});

// Crosshair: the hit target is the whole plot, not the 2px line.
const chart = document.getElementById('chart');
chart.addEventListener('mousemove', (event) => {
  const box = chart.getBoundingClientRect();
  const points = Number(chart.dataset.points || 0);
  if (!points) return;
  const L = 46 / 600 * box.width;
  const plot = (600 - 46 - 8) / 600 * box.width;
  const frac = (event.clientX - box.left - L) / plot;
  const next = Math.round(Math.min(1, Math.max(0, frac)) * (points - 1));
  if (next === hoverIndex) return;
  hoverIndex = next;
  render();
});
chart.addEventListener('mouseleave', () => {
  hoverIndex = null;
  render();
});

// ---- server target --------------------------------------------------------

// The page is not always served by the sidecar: on a static host it has no API
// of its own, so the base URL cannot be assumed to be the page's own origin.
// The target therefore comes from the URL, or from servers.json fetched next to
// the page. An empty url means same-origin - what happens when the sidecar
// serves this page itself, which is why that is also the fallback.
const DEFAULT_TARGETS = [{ id: 'local', label: 'Local sidecar', url: '' }];

let targets = DEFAULT_TARGETS;
let target = DEFAULT_TARGETS[0];
let stream = null;

// A trailing slash would double up against the '/api/...' paths.
const normaliseBase = (url) => String(url || '').replace(/\/+$/, '');

const api = (path) => target.url + path;

// /target/<host>, /target/<host:port>, /target/<host>/<base-path>, or a whole
// URL. A bare host gets https: this page is served over https, so a plain http
// sidecar would be blocked as mixed content long before it answered. Put the
// sidecar behind a tunnel or a proxy that terminates TLS.
function parsePathTarget() {
  const match = location.pathname.match(/^\/target\/(.+)$/);
  if (!match) return null;

  let spec = decodeURIComponent(match[1]).replace(/\/+$/, '');
  if (!spec) return null;

  // Browsers collapse a doubled slash inside a path, so a scheme written into
  // /target/ arrives as "http:/host". Put the slash back before parsing, or the
  // host would come out as "http".
  spec = spec.replace(/^(https?):\/+/i, '$1://');
  if (!/^https?:\/\//i.test(spec)) spec = 'https://' + spec;

  let url;
  try {
    url = new URL(spec);
  } catch {
    return null; // not a host at all; fall through to the normal resolution
  }

  // Keep any path, so a sidecar proxied under a prefix still works.
  const suffix = url.pathname === '/' ? '' : url.pathname;
  return { id: 'path', label: url.host + suffix, url: normaliseBase(url.origin + suffix) };
}

async function loadTargets() {
  // The URL wins over everything: a link has to be able to name its server.
  const fromPath = parsePathTarget();
  if (fromPath) return [fromPath];

  // ?api=<url> is the same idea without the path routing, for hosts that cannot
  // serve one page from many paths.
  const adhoc = new URLSearchParams(location.search).get('api');
  if (adhoc) return [{ id: 'custom', label: adhoc, url: normaliseBase(adhoc) }];

  let list;
  try {
    // Absolute: under /target/... a relative fetch would look one level down.
    const res = await fetch('/servers.json', { cache: 'no-store' });
    if (!res.ok) return DEFAULT_TARGETS;
    // A single-page host answers 200 with index.html for a missing file, so
    // the parse is as much of a check as the status is.
    list = await res.json();
  } catch {
    return DEFAULT_TARGETS;
  }

  const clean = (Array.isArray(list) ? list : [])
    .filter((s) => s && s.id)
    .map((s) => ({ id: String(s.id), label: String(s.label || s.id), url: normaliseBase(s.url) }));
  return clean.length ? clean : DEFAULT_TARGETS;
}

// ?server=<id> wins over the last choice, so a link can pin one server.
function pickTarget() {
  const wanted = new URLSearchParams(location.search).get('server') || remembered();
  return targets.find((t) => t.id === wanted) || targets[0];
}

// Private-mode browsers throw on storage rather than returning null.
function remembered() {
  try { return localStorage.getItem('fb.server'); } catch { return null; }
}

function remember(id) {
  try { localStorage.setItem('fb.server', id); } catch { /* not fatal */ }
}

function renderTargets() {
  const select = document.getElementById('server');
  select.hidden = targets.length < 2;
  select.replaceChildren(...targets.map((t) => {
    const option = document.createElement('option');
    option.value = t.id;
    option.textContent = t.label;
    option.selected = t.id === target.id;
    return option;
  }));

  // With one target there is no picker, but on a static host the reader still
  // needs to know which server they are looking at.
  const note = document.getElementById('target-note');
  note.textContent = targets.length < 2 && target.url ? target.label : '';
}

// Nothing survives a switch: ticks, surfaces and colour slots all belong to the
// game that was being watched, and a stale panel next to a new server misleads.
function clearView() {
  const ids = ['tiles', 'tabs', 'windows', 'produced', 'produced-table', 'consumed',
    'consumed-table', 'fluids', 'power', 'chart', 'chart-legend', 'chart-table'];
  for (const id of ids) document.getElementById(id).innerHTML = '';
  document.getElementById('tip').hidden = true;
  document.getElementById('clock').textContent = '—';
  document.getElementById('window-note').textContent = '';
  document.getElementById('foot').textContent = '—';
}

function selectTarget(id) {
  const next = targets.find((t) => t.id === id);
  if (!next || next.id === target.id) return;
  target = next;
  remember(target.id);

  if (stream) stream.close();
  stream = null;
  snapshot = null;
  surface = null;
  selectedWindow = null;
  lastAt = 0;
  hoverIndex = null;
  colourSlots.clear();
  clearView();
  setStatus('', 'connecting…');
  connect();
}

document.getElementById('server').addEventListener('change', (event) => {
  selectTarget(event.target.value);
});

// A statically hosted page has no API of its own, so the same-origin fallback is
// a dead end until the URL names a sidecar. Say that, rather than spinning on
// "reconnecting" forever. Built as nodes, never markup: the host comes out of
// the address bar and must not be able to write HTML into the page.
function showSetupHint() {
  const tile = document.createElement('div');
  tile.className = 'tile wide';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = 'No sidecar reachable';

  const where = document.createElement('code');
  where.textContent = (target.url || location.origin) + '/api/stream';
  const how = document.createElement('code');
  how.textContent = location.origin + '/target/<sidecar-host>';

  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.append('Nothing answered at ', where, '. Name a sidecar in the URL: ', how,
    ' — it has to be reachable over https, so put it behind a tunnel rather than opening a port.');

  tile.append(label, sub);
  document.getElementById('tiles').replaceChildren(tile);
}

// ---- transport ------------------------------------------------------------

function setStatus(cls, text) {
  document.getElementById('dot').className = 'dot ' + cls;
  document.getElementById('conn').textContent = text;
}

function connect() {
  const source = new EventSource(api('/api/stream'));
  stream = source;

  source.onmessage = (event) => {
    if (stream !== source) return; // superseded by a target switch
    try {
      snapshot = JSON.parse(event.data);
      lastAt = Date.now();
      render();
    } catch (err) {
      setStatus('down', 'bad frame');
    }
  };

  source.onopen = () => {
    if (stream === source) setStatus('live', 'live');
  };

  source.onerror = () => {
    if (stream !== source) return;
    setStatus('down', 'reconnecting…');
    // Never connected at all: the target is wrong, not merely down.
    if (!snapshot) showSetupHint();
    source.close();
    setTimeout(() => {
      if (stream === source) connect();
    }, 2000);
  };
}

// The game can be paused or the server stopped while the stream stays open, so
// age is tracked separately from connection state.
setInterval(() => {
  if (!lastAt) return;
  const age = Date.now() - lastAt;
  if (age > 5000) setStatus('stale', `no data for ${Math.round(age / 1000)}s`);
  else if (age > 2500) setStatus('stale', 'lagging');
  else setStatus('live', 'live');
}, 1000);

(async function boot() {
  targets = await loadTargets();
  target = pickTarget();
  renderTargets();
  connect();
})();

// ---- dot-matrix accent ----------------------------------------------------

// An inset field of dots on an orthographic camera, breathing on a 2 s cycle
// and drifting a little towards the pointer. Everything here is ornament: the
// container already paints a CSS dot grid, so if Three.js never arrives, or the
// reader asked for reduced motion, that grid is what stays on screen.
(function dotMatrix() {
  const container = document.getElementById('webgl-container');
  if (!container) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  script.async = true;
  script.onerror = () => { /* CSS dot grid remains */ };
  script.onload = () => { try { start(window.THREE); } catch { /* ornament only */ } };
  document.head.appendChild(script);

  function start(THREE) {
    if (!THREE) return;
    const width = container.clientWidth;
    const height = container.clientHeight;
    if (!width || !height) return;

    const scene = new THREE.Scene();
    const aspect = width / height;
    const d = 14;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    camera.position.set(20, 20, 20);
    camera.lookAt(scene.position);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // A flat lattice in the xz plane. Sparse, per the design note - the gaps
    // are what make it read as a matrix rather than a texture.
    const SIDE = 40, STEP = 0.9;
    const positions = new Float32Array(SIDE * SIDE * 3);
    let i = 0;
    for (let a = 0; a < SIDE; a++) {
      for (let b = 0; b < SIDE; b++) {
        positions[i++] = (a - SIDE / 2) * STEP;
        positions[i++] = 0;
        positions[i++] = (b - SIDE / 2) * STEP;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Written as a shader rather than PointsMaterial so each dot can fade with
    // depth on its own - the "soft depth fade" the effect is built from.
    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0x00E5FF) },
      },
      vertexShader: `
        uniform float uTime;
        varying float vFade;
        void main() {
          vec3 p = position;
          // Breathing pulse: one slow wave crossing the lattice.
          float wave = sin(length(p.xz) * 0.35 - uTime * 3.1415);
          p.y = wave * 1.1;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = 2.2;
          // Nearer dots are brighter; the wave crest brightens too.
          vFade = clamp(0.18 + wave * 0.28 + (mv.z + 24.0) / 48.0 * 0.55, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vFade;
        void main() {
          // Round dots, not squares.
          vec2 c = gl_PointCoord - vec2(0.5);
          if (dot(c, c) > 0.25) discard;
          gl_FragColor = vec4(uColor, vFade);
        }
      `,
    });

    scene.add(new THREE.Points(geometry, material));

    // Pointer parallax, deliberately understated: a drift, not a camera rig.
    let px = 0, py = 0, tx = 0, ty = 0;
    container.addEventListener('pointermove', (event) => {
      const box = container.getBoundingClientRect();
      tx = ((event.clientX - box.left) / box.width - 0.5) * 2.5;
      ty = ((event.clientY - box.top) / box.height - 0.5) * 2.5;
    });
    container.addEventListener('pointerleave', () => { tx = 0; ty = 0; });

    const t0 = performance.now();
    (function frame(now) {
      requestAnimationFrame(frame);
      // A hidden tab still fires rAF in some browsers; skip the work anyway.
      if (document.hidden) return;
      px += (tx - px) * 0.05;
      py += (ty - py) * 0.05;
      // 2000 ms, the documented long beat.
      material.uniforms.uTime.value = ((now - t0) % 2000) / 2000;
      camera.position.set(20 + px, 20 - py, 20 - px);
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
    })(t0);

    window.addEventListener('resize', () => {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      const a = w / h;
      camera.left = -d * a; camera.right = d * a;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  }
})();
</script>
</body>
</html>
